<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vault">
<meta name="theme-color" content="#f2f2f7">
<title>Local Vault Pro</title>
<style>
/* ===== 6 套主题：每套都定义全部变量 ===== */
:root,[data-theme=light]{--r:14px;--bg:#f2f2f7;--bgimg:linear-gradient(transparent,transparent);--card:#fff;--rowbg:#fff;--dlg:#fff;--text:#1c1c1e;--sub:#6e6e73;--line:#e8e8ed;--edge:transparent;--accent:#0a84ff;--afg:#fff;--chip:#f2f2f7;--danger:#ff3b30;--ok:#30b27a;--warn:#ff9f0a;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);--mask:rgba(0,0,0,.35);--blur:none}
[data-theme=sage]{--r:14px;--bg:#eceee6;--bgimg:linear-gradient(transparent,transparent);--card:#f8f6ef;--rowbg:#f8f6ef;--dlg:#f8f6ef;--text:#3a3f37;--sub:#7b8174;--line:#dfdfd0;--edge:rgba(255,255,255,.5);--accent:#7d9a80;--afg:#fff;--chip:#e9ebdd;--danger:#c0675a;--ok:#6f9a76;--warn:#c9964f;--sh:0 1px 2px rgba(60,70,50,.05),0 4px 14px rgba(60,70,50,.07);--mask:rgba(40,45,35,.4);--blur:none}
[data-theme=peach]{--r:18px;--bg:#fff3ea;--bgimg:radial-gradient(circle at 8% 0%,rgba(255,196,168,.55),transparent 42%),radial-gradient(circle at 100% 15%,rgba(255,226,170,.5),transparent 38%);--card:#fffaf6;--rowbg:#fffaf6;--dlg:#fffaf6;--text:#4a3732;--sub:#9b7f75;--line:#f5dfd1;--edge:rgba(255,255,255,.9);--accent:#f2825f;--afg:#fff;--chip:#fde9dc;--danger:#d9534f;--ok:#5fb184;--warn:#e69a3c;--sh:inset 0 2px 0 rgba(255,255,255,.8),0 8px 22px rgba(242,130,95,.18),0 2px 4px rgba(242,130,95,.08);--mask:rgba(120,70,50,.3);--blur:none}
[data-theme=aurora]{--r:18px;--bg:#e9e6fa;--bgimg:radial-gradient(ellipse at 15% 10%,rgba(190,170,255,.7),transparent 50%),radial-gradient(ellipse at 90% 20%,rgba(150,205,255,.7),transparent 50%),radial-gradient(ellipse at 50% 100%,rgba(230,190,255,.55),transparent 55%);--card:rgba(255,255,255,.5);--rowbg:rgba(250,248,255,.8);--dlg:rgba(248,246,255,.86);--text:#262445;--sub:#67648d;--line:rgba(110,100,190,.16);--edge:rgba(255,255,255,.75);--accent:#7566ee;--afg:#fff;--chip:rgba(255,255,255,.55);--danger:#e5484d;--ok:#2fae7d;--warn:#e29a2a;--sh:0 8px 32px rgba(100,90,200,.16);--mask:rgba(60,50,130,.28);--blur:blur(16px) saturate(150%)}
[data-theme=caramel]{--r:14px;--bg:#eadccb;--bgimg:linear-gradient(180deg,rgba(255,244,226,.7),transparent 320px);--card:#f8efe2;--rowbg:#f8efe2;--dlg:#f8efe2;--text:#45301f;--sub:#8d715d;--line:#e0cdb4;--edge:rgba(255,255,255,.4);--accent:#a5642f;--afg:#fff;--chip:#ecdcc5;--danger:#b3402f;--ok:#6b8c55;--warn:#c4862b;--sh:0 1px 2px rgba(69,48,31,.1),0 8px 20px rgba(69,48,31,.12);--mask:rgba(50,32,20,.45);--blur:none}
[data-theme=dark]{--r:14px;--bg:#0e0f11;--bgimg:radial-gradient(circle at 85% -10%,rgba(76,157,255,.14),transparent 45%),radial-gradient(circle at 0% 100%,rgba(140,100,255,.08),transparent 40%);--card:#1a1b1f;--rowbg:#1a1b1f;--dlg:#1d1e23;--text:#ececf0;--sub:#9a9aa5;--line:#2a2b31;--edge:rgba(255,255,255,.07);--accent:#4c9dff;--afg:#06101e;--chip:#25262c;--danger:#ff6259;--ok:#45c78a;--warn:#ffb340;--sh:inset 0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.45);--mask:rgba(0,0,0,.65);--blur:none}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-x:none;background:var(--bg)}
body{overscroll-behavior-x:none;margin:0;background:transparent;color:var(--text);min-height:100vh;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg);pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=checkbox]{width:auto;accent-color:var(--accent);transform:scale(1.15)}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}
input[type=color]{width:42px;height:34px;padding:2px}
textarea{resize:vertical}
.cat,.stat,.relbar,.dlg,.tb{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{font-size:16px;white-space:nowrap}
.search{flex:1 1 260px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tb{padding:7px 12px;border-radius:calc(var(--r) - 4px);background:var(--card);border:1px solid var(--edge);outline:1px solid var(--line);outline-offset:-1px;white-space:nowrap;box-shadow:var(--sh);transition:transform .12s,outline-color .15s}
.tb:hover{outline-color:var(--accent)}
.tb:active{transform:scale(.95)}
.tb.pri{background:var(--accent);color:var(--afg);outline-color:var(--accent)}
.tb.on{outline-color:var(--accent);color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:14px 16px 110px;display:flex;flex-direction:column}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--r);padding:10px 12px;text-align:left;box-shadow:var(--sh);border:1px solid var(--edge);display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px)}
.stat i{font-style:normal}.stat b{font-size:20px}.stat span{color:var(--sub);font-size:12px}
.stat.warn b{color:var(--warn)}.stat.on{border-color:var(--accent)}
.sech{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:12.5px;margin:0 2px 6px}
.sc{display:inline-flex;gap:2px;flex:none}
.sc .ib{background:var(--chip);min-width:24px}
.relbar{background:var(--card);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--edge)}
.relh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.relh>button:first-child{color:var(--sub);font-size:13px;text-align:left}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.chip{flex:none;padding:3px 10px;border-radius:99px;background:var(--chip);font-size:12.5px;border:1px solid transparent;white-space:nowrap;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip em{font-style:normal;color:var(--sub);margin-left:4px}
.subbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;color:var(--sub);font-size:13px}
.subbar button:not(.ib){padding:4px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.cat{background:var(--card);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--sh);overflow:hidden;border:1px solid var(--edge);transition:background .3s}
.cat-h{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,transparent),color-mix(in srgb,var(--c) 4%,transparent));border-left:4px solid var(--c);user-select:none}
.cat-h b{color:var(--c);font-size:15px}
.catsort{width:auto;padding:2px 6px;font-size:12px;border-radius:99px}
.cico{font-size:18px}.chev{width:14px;color:var(--sub);transition:transform .2s}
.badge{font-size:11.5px;padding:1px 9px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:var(--c,var(--accent))}
.sp{flex:1}
/* 折叠过渡 */
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s ease}
.fold>.fi{overflow:hidden;min-height:0}
.fold.closed{grid-template-rows:0fr}
.fold.closed>.fi{visibility:hidden;transition:visibility 0s .32s}
.app{border-top:1px solid var(--line)}
.app-h{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;flex-wrap:wrap}
.aico{width:34px;height:34px;border-radius:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.35)}
.ainfo{display:flex;flex-direction:column;min-width:0;flex:1}
.ainfo small{color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.rw{position:relative;overflow:hidden;border-top:1px dashed var(--line)}
.rowact{display:none;position:absolute;right:0;top:0;bottom:0;width:224px}
body.touch .rowact{display:flex}
.rw:not(.swp) .rowact{visibility:hidden}
.rowact button{flex:1;color:#fff;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.rowact small{font-size:11px}
.row{position:relative;background:var(--rowbg);touch-action:pan-y;will-change:transform;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 14px 8px 28px;transition:background .2s}
.row:hover{background:color-mix(in srgb,var(--accent) 5%,var(--rowbg))}
.row.flash{background:color-mix(in srgb,var(--ok) 24%,var(--rowbg))}
body.touch .acts .dup{display:none}
.title{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:110px}
.tag{font-size:11.5px;padding:0 8px;border-radius:99px;white-space:nowrap}
.cells{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;flex:1 1 300px;min-width:0}
.cell{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:1px 4px 1px 10px;max-width:100%}
.cell i{font-style:normal;font-size:12px}.cell small{color:var(--sub);font-size:11.5px}
.cell code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
.cell .txt{word-break:break-all}
.bd{font-size:12px;color:var(--sub);background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:1px 10px;white-space:nowrap}
.bd.link{cursor:pointer;transition:color .15s,transform .12s}.bd.link:hover{color:var(--accent)}.bd.link:active{transform:scale(.95)}
.note{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ib{padding:2px 6px;border-radius:99px;font-size:13px;line-height:1.4;transition:transform .12s,background .15s}
.ib:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.ib:active{transform:scale(.8)}
.acts{display:flex;gap:2px;margin-left:auto}
.urlline{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.urlchip{color:var(--accent);word-break:break-all;font-weight:500;background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:99px;padding:1px 12px}
.mini{padding:2px 12px;border-radius:99px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-size:12.5px;transition:transform .12s}
.mini:active{transform:scale(.92)}
.star{opacity:.9}
/* 复制成功态 */
.copied{background:var(--ok)!important;color:#fff!important;animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
body.card .rw{margin:6px 12px;border:1px solid var(--line);border-radius:calc(var(--r) - 2px)}
body.card .row{padding:12px 14px}
body.card .app-h{padding:14px}
.empty{text-align:center;color:var(--sub);padding:60px 0}
#batchbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;background:var(--dlg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:96vw;border:1px solid var(--line);animation:popIn .25s ease}
#batchbar button{padding:6px 12px;border-radius:99px;background:var(--chip)}
#batchbar button:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
#modal,#modal2,#modal3{position:fixed;inset:0;z-index:50;pointer-events:none}
#modal2{z-index:60}#modal3{z-index:70}
.mask{position:absolute;inset:0;background:var(--mask);display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:auto;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overscroll-behavior:contain;animation:fadeIn .2s ease}
.dlg{background:var(--dlg);border:1px solid var(--edge);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(680px,100%);max-height:92vh;overflow:auto;padding:20px;overscroll-behavior:contain;animation:popIn .28s cubic-bezier(.2,.9,.3,1.2)}
.still .mask,.still .dlg{animation:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
.dlg.sm{width:min(430px,100%)}.dlg.lg{width:min(780px,100%)}
.dlg h3{margin:0 0 12px;font-size:17px}
.dlg h4{margin:16px 0 6px;font-size:13px;color:var(--sub);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--sub)}
.fl.full{grid-column:1/-1}
.ctl{display:flex;gap:4px;align-items:center}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:99px;background:var(--chip);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.95)}
.btn.pri{background:var(--accent);color:var(--afg);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:4px 12px;font-size:13px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:6px 12px;border-radius:99px;background:var(--chip);border:1px solid transparent;transition:transform .12s}
.pill:active{transform:scale(.95)}
.pill.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border-color:var(--accent)}
.qa{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}
.err{color:var(--danger);min-height:18px;margin:8px 0 0;font-size:13px}
.msg{color:var(--sub);margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow small{display:block;color:var(--sub)}
.srow select{width:auto}
.box{background:var(--chip);border-radius:12px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.kv{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.kv>span:first-child{color:var(--sub);min-width:84px;font-size:12.5px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl>div{position:relative;padding:4px 0 8px}
.tl>div:before{content:"";position:absolute;left:-18px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.emo{display:flex;flex-wrap:wrap;gap:2px;max-height:110px;overflow:auto;margin-top:6px}
.emo button{font-size:19px;padding:2px 5px;border-radius:8px}.emo button:hover{background:var(--chip)}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:3px solid transparent;transition:transform .12s}
.sw button:hover{transform:scale(1.15)}
.sw button.on{border-color:var(--text)}
/* 换肤面板 */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px;border-radius:16px;background:var(--chip);border:2px solid transparent;transition:transform .15s,border-color .15s}
.skin:hover{transform:translateY(-2px)}
.skin.on{border-color:var(--accent)}
.skin small{color:var(--sub);font-size:11.5px}
.sw2{position:relative;display:block;width:100%;height:44px;border-radius:11px;background:var(--bgimg),var(--bg);border:1px solid rgba(128,128,128,.25);overflow:hidden;margin-bottom:4px}
.sw2 .c{position:absolute;left:8px;right:34px;top:8px;bottom:8px;border-radius:8px;background:var(--card);border:1px solid var(--edge);box-shadow:var(--sh)}
.sw2 .a{position:absolute;right:9px;top:13px;width:18px;height:18px;border-radius:50%;background:var(--accent)}
/* 毛玻璃锁屏舱 */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:hidden}
.lock::before{content:"";position:absolute;inset:0;background:var(--bgimg),radial-gradient(circle at 20% 15%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 55%),radial-gradient(circle at 85% 85%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 55%)}

.lockc{position:relative;width:min(380px,100%);background:var(--dlg);border:1px solid var(--line);border-radius:26px;padding:30px 26px;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center;animation:popIn .5s cubic-bezier(.2,.9,.3,1.2)}
.lockc .logo{font-size:46px;display:inline-block}
.lockc h2{margin:6px 0 4px}.lockc p{color:var(--sub);margin:0 0 14px}
.lockc input{margin-bottom:10px;text-align:left;border-radius:14px;padding:10px 12px}
.lockc input.bad{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 22%,transparent)}
.lockc .btn{width:100%;margin-top:4px;padding:10px}
.lockc.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-12px)}30%{transform:translateX(10px)}45%{transform:translateX(-8px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.lockc.ok{animation:leave .5s ease .12s forwards}
.lockc.ok .logo{animation:unlock .6s ease forwards}
@keyframes unlock{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.45) rotate(-14deg)}100%{transform:scale(1.15) rotate(0)}}
@keyframes leave{to{opacity:0;transform:translateY(-12px) scale(.97)}}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:94vw}
#toast div{background:#222;color:#fff;padding:8px 16px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:13px;text-align:center;animation:popIn .25s ease}
#clip{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:150;background:#1d1d1f;color:#fff;border-radius:99px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#clip button{background:rgba(255,255,255,.18);border-radius:99px;padding:2px 10px;color:#fff;font-size:12px}
.gout{font:600 20px ui-monospace,Menlo,Consolas,monospace;background:var(--chip);border-radius:12px;padding:12px;word-break:break-all;text-align:center;margin-bottom:10px}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.opt label{display:flex;gap:5px;align-items:center}
@media(max-width:700px){
 .stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.tb .t{display:none}.row{padding-left:14px}.acts{margin-left:0}.qa{grid-template-columns:1fr}
 .mask{align-items:flex-end;padding:0}
 .dlg,.dlg.sm,.dlg.lg{width:100%!important;border-radius:22px 22px 0 0;max-height:90vh;padding-bottom:max(20px,env(safe-area-inset-bottom));animation:sheetIn .3s cubic-bezier(.2,.9,.3,1)}
 .still .dlg{animation:none}
 .dlg::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 12px}
}

const IT=200000;
async function derive(pw,salt,it=IT){const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,obj,salt,it=IT){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return{v:1,it,salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ct))}}
async function unseal(key,blob){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},key,unb64(blob.data));return JSON.parse(dec.decode(pt))}
async function tryOpen(pw,blob){try{const k=await derive(pw,unb64(blob.salt),blob.it||IT);return{key:k,vault:await unseal(k,blob)}}catch(e){return null}}
async function newKey(pw){const salt=crypto.getRandomValues(new Uint8Array(16));return{salt,key:await derive(pw,salt,IT),it:IT}}

/* ========== 密码生成器 ========== */
function randInt(n){const m=Math.floor(0x100000000/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=m);return a[0]%n}
function genPw(o){
 const amb='ilLI1oO0';const strip=s=>o.noamb?[...s].filter(c=>!amb.includes(c)).join(''):s;
 const sets=[];if(o.lower)sets.push(strip('abcdefghijklmnopqrstuvwxyz'));if(o.upper)sets.push(strip('ABCDEFGHIJKLMNOPQRSTUVWXYZ'));if(o.digit)sets.push(strip('0123456789'));if(o.sym)sets.push('!@#$%^&*()-_=+[]{};:,.?');
 if(!sets.length)sets.push(strip('abcdefghijklmnopqrstuvwxyz'));
 const all=sets.join(''),len=Math.max(o.len,sets.length),out=sets.map(s=>s[randInt(s.length)]);
 while(out.length<len)out.push(all[randInt(all.length)]);
 for(let i=out.length-1;i>0;i--){const j=randInt(i+1);[out[i],out[j]]=[out[j],out[i]]}
 return out.join('')}
const six=()=>Array.from({length:6},()=>randInt(10)).join('');
function openGen(cb){
 G=Object.assign(G||{len:16,lower:true,upper:true,digit:true,sym:true,noamb:true,out:''},{cb});G.out=genPw(G);drawGen()}

 setModal('#modal3',`<div class="mask"><div class="dlg sm"><h3>🎲 随机强密码生成器</h3><div class="gout" id="gout">${esc(G.out)}</div>

 <div class="opt"><label><input type="checkbox" data-g="lower" ${G.lower?'checked':''}>小写</label><label><input type="checkbox" data-g="upper" ${G.upper?'checked':''}>大写</label><label><input type="checkbox" data-g="digit" ${G.digit?'checked':''}>数字</label><label><input type="checkbox" data-g="sym" ${G.sym?'checked':''}>符号</label></div>
 <div class="opt"><label><input type="checkbox" data-g="noamb" ${G.noamb?'checked':''}>排除易混淆字符（i l 1 L o 0 O）</label></div>
 <div class="foot" style="justify-content:flex-start"><button class="btn sm" data-act="gRe">🔄 重新生成</button><button class="btn sm" data-act="gSix">🔢 纯6位数字</button><button class="btn sm" data-act="gCp">📋 复制</button></div>
 <div class="foot"><button class="btn" data-act="gClose">关闭</button>${G.cb?'<button class="btn pri" data-act="gUse">✅ 使用此密码</button>':''}</div></div></div>`)}

/* ========== 健康检查 / 过滤 ========== */
function getHealth(){
 const H={weak:new Set(),dup:new Set(),old:new Set()},cnt=new Map(),its=activeItems().filter(i=>i.password);
 its.forEach(i=>cnt.set(i.password,(cnt.get(i.password)||0)+1));
 its.forEach(i=>{const p=i.password,cls=[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(p)).length;
  if(p.length<8||cls<2||WEAK.includes(p.toLowerCase()))H.weak.add(i.id);
  if(cnt.get(p)>1)H.dup.add(i.id);
  if(now()-(i.pwChangedAt||i.updatedAt||i.createdAt)>180*86400000)H.old.add(i.id)});
 return H}
const hay=i=>{const a=appOf(i.appId),c=a&&catOf(a.catId);return[a?.name,a?.note,a?.url,c?.name,i.name,i.account,i.notes,(i.tags||[]).join(' '),i.phone,i.email,i.login,i.url,i.bankName,i.keyName,...(i.qa||[]).map(x=>x.q)].join('\n').toLowerCase()};
function match(it,c){
 if(it.deletedAt||!appOk(it))return false;
 if(S.health&&!c.H[S.health].has(it.id))return false;
 if(S.rel){const r=S.rel;if(r.k==='tag'){if(!(it.tags||[]).includes(r.v))return false}else if((it[r.k]||'').trim()!==r.v)return false}
 if(c.q&&!hay(it).includes(c.q))return false;return true}

async function saveForm(){
 const f=F,V_=V();
 if(!['name','url','account','password','pay','notes'].some(k=>(f[k]||'').trim())){$('#ferr').textContent='请至少填写名称、链接、账号、密码或备注中的任意一项';return}
 let nm=(f.appName||'').trim()||f.name.trim()||(f.url?hostOf(f.url):'')||'未命名软件';
 let app=V_.apps.find(a=>!a.deletedAt&&a.catId===f.catId&&a.name===nm);
 const orig=f._app?appOf(f._app):null;
 if(!app&&orig&&V_.items.filter(i=>i.appId===orig.id).length===1){orig.name=nm;orig.catId=f.catId;app=orig}
 if(!app){app={id:uid(),catId:f.catId,name:nm,icon:'',url:'',note:''};V_.apps.push(app)}
 const same=orig&&orig.id===app.id;
 if(same||f.appUrl.trim())app.url=f.appUrl.trim();
 if(same||f.appNote.trim())app.note=f.appNote.trim();
 const flds=['type','name','account','password','pay','phone','email','login','url','bankName','expiry','cvv','keyName','notes','recovery'];
 const qa=f.qa.filter(x=>x.q.trim()||x.a.trim());
 if(f._edit){
  const it=item(f._edit),st=V_.settings;
  if(st.history)['password','pay'].forEach(k=>{if(it[k]&&it[k]!==f[k])it.passwordHistory.push({f:k,pw:it[k],at:now()})});
  if(st.histLimit>0)while(it.passwordHistory.length>st.histLimit)it.passwordHistory.shift();
  if(it.password!==f.password)it.pwChangedAt=now();
  flds.forEach(k=>it[k]=typeof f[k]==='string'&&k!=='type'?f[k].trim():f[k]);it.notes=f.notes.trim();
  it.tags=[...f.tags];it.qa=qa;it.appId=app.id;it.updatedAt=now();
 }else{
  const it={id:uid(),star:false,passwordHistory:[],createdAt:now(),updatedAt:now(),pwChangedAt:now(),tags:[...f.tags],qa,appId:app.id};
  flds.forEach(k=>it[k]=typeof f[k]==='string'&&k!=='type'?f[k].trim():f[k]);V_.items.push(it);
  if(app.collapsed)app.collapsed=false;
 }
 const o=f._app?appOf(f._app):null;
 if(o&&o.id!==app.id&&!V_.items.some(i=>i.appId===o.id))V_.apps=V_.apps.filter(a=>a.id!==o.id);
 F=null;closeM('#modal');await persist();render();toast('已保存 ✅')}

/* ========== 手机端手势：账号行左右滑 / 弹窗下滑关闭 ========== */
const RACT=224;let TS=null,DS=null,openRw=null,lastSwipe=0;
function closeRw(){if(openRw){const rw=openRw,r=rw.querySelector('.row');if(r){r.style.transition='transform .25s ease';r.style.transform=''}openRw=null;setTimeout(()=>{if(openRw!==rw)rw.classList.remove('swp')},400)}}
function copyRowPw(id){
 const it=item(id);if(!it)return;
 const pw=it.type==='bank'?(it.pay||it.password):(it.password||it.pay);

document.addEventListener('touchstart',e=>{
 TS=null;DS=null;if(!SES||e.touches.length!==1)return;
 const t=e.touches[0],rw=e.target.closest('.rw');
 if(openRw&&openRw!==rw&&!e.target.closest('.rowact'))closeRw();
 const dlg=e.target.closest('.dlg');
 if(dlg){
  if(e.target.closest('input,textarea,select'))return;
  if(dlg.scrollTop<=0)DS={dlg,id:'#'+dlg.closest('#modal,#modal2,#modal3').id,x:t.clientX,y:t.clientY,dy:0,mode:null};
  return}
 if(!rw||e.target.closest('input,select,textarea,.rowact'))return;
 if(t.clientX<25||t.clientX>innerWidth-25)return;
 const row=rw.querySelector('.row');
 TS={rw,row,x:t.clientX,y:t.clientY,dx:0,mode:null,base:openRw===rw?-RACT:0};
 row.style.transition='none'},{passive:true});
document.addEventListener('touchmove',e=>{
 const t=e.touches[0];
 if(DS){
  const dx=t.clientX-DS.x,dy=t.clientY-DS.y;
  if(!DS.mode){if(dy>8&&dy>Math.abs(dx))DS.mode='v';else if(Math.abs(dx)>8||dy<-8){DS=null;return}}
  if(DS&&DS.mode==='v'){DS.dy=Math.max(0,dy);DS.dlg.style.transition='none';DS.dlg.style.transform=`translateY(${DS.dy}px)`;DS.dlg.style.opacity=String(1-Math.min(.5,DS.dy/500))}
  return}
 if(!TS)return;
 const dx=t.clientX-TS.x,dy=t.clientY-TS.y;
 if(!TS.mode){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){TS.mode='h';TS.rw.classList.add('swp')}else if(Math.abs(dy)>10)TS.mode='v'}
 if(TS.mode!=='h')return;
 TS.dx=dx;let off=TS.base+dx;
 if(off>0)off=Math.min(90,off*.45);
 if(off<-RACT)off=-RACT-Math.min(30,(-RACT-off)*.3);
 TS.row.style.transform=`translateX(${off}px)`},{passive:true});
function endTouch(cancel){
 if(DS){
  const d=DS;DS=null;
  if(d.mode==='v'){
   lastSwipe=now();
   if(!cancel&&d.dy>110){d.dlg.style.transition='transform .2s ease,opacity .2s ease';d.dlg.style.transform='translateY(100%)';d.dlg.style.opacity='0';setTimeout(()=>closeModalEl(d.id),180)}
   else{d.dlg.style.transition='transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s';d.dlg.style.transform='';d.dlg.style.opacity=''}}
  return}
 if(!TS)return;
 const {rw,row,dx,mode,base}=TS;TS=null;
 if(mode!=='h'){row.style.transition='';return}
 lastSwipe=now();
 row.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1)';
 if(cancel){row.style.transform=base?`translateX(${-RACT}px)`:'';return}
 if(base===0){
  if(dx<-50){row.style.transform=`translateX(${-RACT}px)`;openRw=rw}
  else if(dx>50){row.style.transform='';row.classList.add('flash');setTimeout(()=>row.classList.remove('flash'),700);copyRowPw(rw.dataset.rid)}
  else row.style.transform=''}
 else{
  if(dx>50){row.style.transform='';openRw=null}
  else row.style.transform=`translateX(${-RACT}px)`}
 setTimeout(()=>{if(openRw!==rw)rw.classList.remove('swp')},420)}
document.addEventListener('touchend',()=>endTouch(false));
document.addEventListener('touchcancel',()=>endTouch(true));
document.addEventListener('click',e=>{if(now()-lastSwipe<350){e.stopPropagation();e.preventDefault()}},true);

 async bMove(){if(!S.sel.size)return toast('请先勾选账号');
  const r=await ask('批量移动分类',[{k:'to',label:'目标分类',type:'select',options:V().cats.map(c=>[c.id,c.icon+' '+c.name])}]);if(!r)return;
  const from=new Set();S.sel.forEach(id=>{const it=item(id);if(!it)return;const a=appOf(it.appId);if(a.catId===r.to)return;const t=ensureApp(r.to,a);from.add(a.id);it.appId=t.id});
  V().apps=V().apps.filter(a=>!from.has(a.id)||V().items.some(i=>i.appId===a.id));S.sel.clear();await persist();render();toast('已移动 ✅')},
 async bDel(){if(!S.sel.size)return toast('请先勾选账号');if(!await confirmD(`将 ${S.sel.size} 个账号移入回收站？`,'移入回收站'))return;trashItems([...S.sel]);await persist();render()}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const inp=e.target.closest('input,select,textarea');if(inp&&inp!==t)return;
 if(t.closest('.rowact'))closeRw();
 const fn=A[t.dataset.act];if(fn){Promise.resolve(fn(t.dataset,t,e)).catch(err=>{console.error(err);toast('出错：'+err.message)})}});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.closest('#lock')&&t.tagName==='INPUT'){t.classList.remove('bad');return}
 if(t.id==='q'){S.q=t.value;render();return}
 if(t.dataset.f&&F){F[t.dataset.f]=t.value;return}
 if(t.dataset.qa&&F){const[i,k]=t.dataset.qa.split(':');F.qa[+i][k]=t.value;return}
 if(t.dataset.c&&C){C[t.dataset.c]=t.value;if(t.dataset.c==='color')drawCat();return}
 if(t.dataset.g&&G){const k=t.dataset.g;G[k]=k==='len'?+t.value:t.checked;if(k==='len')$('#glen').textContent=G.len;G.out=genPw(G);$('#gout').textContent=G.out}});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.sel){t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel);renderBatch();return}
 if(t.dataset.selapp){visOfApp(t.dataset.selapp).forEach(i=>t.checked?S.sel.add(i.id):S.sel.delete(i.id));render();return}
 if(t.dataset.catsort&&SES){const c=catOf(t.dataset.catsort);if(c){c.appSort=t.value;persist();render()}return}
 if(t.dataset.set&&SES){const k=t.dataset.set;V().settings[k]=t.type==='checkbox'?t.checked:(t.dataset.n?Number(t.value):t.value);
  if(k==='theme')applyTheme(t.value);persist();render();bump();
  if(k==='health'||k==='relBar')showSettings()}});

/* ========== 启动 ========== */
(function init(){
 if(!(window.crypto&&crypto.subtle)){document.body.innerHTML='<div style="padding:40px;font:16px sans-serif">当前浏览器环境不支持 Web Crypto API（需要安全上下文）。请使用现代浏览器直接打开本文件。</div>';return}
 const th=LS.get('lvp_theme');document.documentElement.dataset.theme=THEMES.some(t=>t[0]===th)?th:'light';showLock()})();
</script>
</body>
