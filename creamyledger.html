<style>
:root{--bg:#FAF7F2;--card:#FFFFFF;--text:#5b4b49;--sub:#a39390;--line:#f0e6df;--pink:#FF9AA2;--mint:#B5EAD7;--cream:#FFDAC1;--lav:#C7CEEA;--shadow:0 6px 20px rgba(214,170,150,.18);--glass:rgba(255,255,255,.72)}
.dark{--bg:#1f1b24;--card:#2a2531;--text:#f1e6e3;--sub:#a99da6;--line:#3b3443;--shadow:0 6px 20px rgba(0,0,0,.35);--glass:rgba(42,37,49,.75)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;background:var(--bg);color:var(--text);font-family:"Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei Rounded","Microsoft YaHei",system-ui,sans-serif;transition:background .3s,color .3s}
#scroller{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sub{color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.5rem;box-shadow:var(--shadow);transition:all .3s}
.hov:hover{transform:translateY(-2px) scale(1.01)}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .9rem;border-radius:9999px;background:var(--card);border:1px solid var(--line);font-size:.85rem;cursor:pointer;transition:all .3s;color:var(--text);white-space:nowrap}
.btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:var(--shadow)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-p{background:linear-gradient(135deg,#FF9AA2,#ffb7a8);color:#fff;border-color:transparent}
.btn-m{background:#B5EAD7;color:#2f6b57;border-color:transparent}
.btn-l{background:#C7CEEA;color:#44507f;border-color:transparent}
.btn-sm{padding:.2rem .65rem;font-size:.75rem}
.inp{width:100%;padding:.55rem .9rem;border-radius:1rem;border:1.5px solid var(--line);background:var(--bg);color:var(--text);outline:none;transition:border .2s}
.inp:focus{border-color:var(--pink)}
.lbl{display:block;font-size:.75rem;color:var(--sub);margin:.6rem 0 .25rem .4rem}
.chip{display:inline-flex;align-items:center;gap:.25rem;padding:.3rem .8rem;border-radius:9999px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:.85rem;transition:all .25s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chip.off{opacity:.5}
.tab{padding:.45rem 1rem;border-radius:9999px;cursor:pointer;font-size:.9rem;transition:all .3s;white-space:nowrap}
.tab:hover{background:var(--line)}
.tab.on{background:var(--pink);color:#fff;box-shadow:var(--shadow)}
.pill{display:inline-block;padding:.05rem .6rem;border-radius:9999px;font-size:.72rem;background:var(--line)}
.exp{color:#ff7d8a}.inc{color:#3fb98a}
.bar{height:14px;border-radius:9999px;background:var(--line);overflow:hidden}
.bar>div{height:100%;border-radius:9999px;transition:width .6s;background:linear-gradient(90deg,#B5EAD7,#FFDAC1)}
.bar>div.over{background:linear-gradient(90deg,#FF9AA2,#ff6f7d)}
.row{display:flex;align-items:center;gap:.75rem;padding:.6rem .9rem;border-radius:1.1rem;transition:all .25s;cursor:pointer}
.row:hover{background:var(--bg);transform:translateX(2px)}
.swr{position:relative;overflow:hidden;border-radius:1.1rem}
.swr>.row{position:relative;z-index:1;background:var(--card);touch-action:pan-y;will-change:transform}
.swr>.row:hover{background:var(--bg)}
.swa{display:none}
.cico{width:2.4rem;height:2.4rem;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:none}
#modal{position:fixed;inset:0;background:rgba(90,60,60,.3);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;padding:1rem}
#modal.show{display:flex}
#modalBox{max-height:92vh;overflow:auto;width:100%;max-width:36rem;padding:1.3rem;animation:pop .3s;overscroll-behavior:contain}
.grab{display:none;width:2.6rem;height:.3rem;border-radius:9999px;background:var(--sub);opacity:.4;margin:-.4rem auto .9rem}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,rgba(255,218,193,.85),rgba(199,206,234,.85),rgba(181,234,215,.85));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);flex-direction:column;overflow:auto;padding:1rem}
#lock>div{margin:auto}
.dark #lock{background:linear-gradient(135deg,rgba(50,40,60,.92),rgba(30,35,60,.92))}
.lockcard{width:min(92vw,24rem);padding:1.6rem 1.4rem;border-radius:2rem;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.6);box-shadow:0 12px 40px rgba(180,120,110,.25);text-align:center;color:var(--text)}
.key{width:4.2rem;height:4.2rem;border-radius:9999px;background:rgba(255,255,255,.7);font-size:1.5rem;cursor:pointer;border:none;color:#5b4b49;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.key:hover{transform:scale(1.08)}.key:active{transform:scale(.92)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #FF9AA2;transition:all .2s}
.dot.f{background:#FF9AA2;transform:scale(1.15)}
.shake{animation:shake .4s}

#toast{position:fixed;left:50%;top:1.2rem;transform:translate(-50%,-120%);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:.6rem 1.2rem;border-radius:9999px;z-index:200;transition:transform .4s;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#zoom{position:fixed;inset:0;background:rgba(40,30,30,.8);z-index:150;display:none;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;border-radius:1.2rem}
.cal-cell{min-height:5.4rem;border-radius:1rem;padding:.35rem .45rem;cursor:pointer;border:1px solid var(--line);transition:all .25s;font-size:.72rem;overflow:hidden}
.cal-cell:hover{transform:translateY(-2px) scale(1.04);box-shadow:var(--shadow)}
.swatch{width:1.8rem;height:1.8rem;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s}
.swatch.on{border-color:var(--text);transform:scale(1.15)}
.eico{width:2.2rem;height:2.2rem;border-radius:.8rem;display:flex;align-items:center;justify-content:center;font-size:1.25rem;cursor:pointer;transition:all .2s;border:2px solid transparent}
.eico:hover{background:var(--line);transform:scale(1.15)}
.eico.on{border-color:var(--pink);background:var(--line)}
.sw{position:relative;width:2.8rem;height:1.6rem;flex:none;display:inline-block;margin-top:.1rem}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1;margin:0}
.sw i{display:block;width:100%;height:100%;border-radius:9999px;background:var(--line);transition:all .3s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:1.1rem;height:1.1rem;border-radius:50%;background:#fff;transition:all .3s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sw input:checked+i{background:#8fdcbf}
.sw input:checked+i::after{transform:translateX(1.2rem)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.calc{padding:.15rem .7rem;font-size:1rem}
#bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom));align-items:flex-end;justify-content:space-around}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:.05rem;font-size:.68rem;color:var(--sub);background:none;border:none;padding:.25rem 0;cursor:pointer;transition:all .25s}
.bni span{font-size:1.25rem}
.bni.on{color:var(--pink);font-weight:700}
.bni.on span{transform:scale(1.15)}
.fab{width:3.6rem;height:3.6rem;border-radius:50%;background:linear-gradient(135deg,#FF9AA2,#ffb7a8);color:#fff;font-size:1.9rem;border:4px solid var(--bg);box-shadow:0 8px 18px rgba(255,154,162,.55);margin:-1.5rem .4rem 0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex:none}
.fab:active{transform:scale(.92)}
@media(max-width:767px){
  .dsk{display:none!important}
  .bn{display:none!important}
  #status{display:none}
  #bnav{display:flex}
  #app{padding-bottom:calc(6.5rem + env(safe-area-inset-bottom))}
  #modal{align-items:flex-end;padding:0}
  #modalBox{max-width:100%;border-radius:1.8rem 1.8rem 0 0;animation:sheet .3s;padding-bottom:calc(1.3rem + env(safe-area-inset-bottom));max-height:90vh;max-height:90dvh}
  .grab{display:block}
  .cal-cell{min-height:4rem;padding:.2rem .25rem}
  #toast{top:.6rem}
  .swa{display:flex;position:absolute;right:0;top:0;bottom:0;width:232px}
  .swa button{flex:1;border:none;font-size:.7rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#5b4b49;cursor:pointer}
  .swa button span{font-size:1.1rem}
}
@media(min-width:768px){#app{padding-bottom:5rem}}
</style>

<div id="lock" class="hidden">

<script>
const APP_VER='1.4.0';
/* ========== 工具 ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>fmt(new Date());
const nowTime=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const money=n=>(n<0?'-':'')+'¥'+Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const mask=n=>S.settings.hide?'****':money(n);
const nowStr=()=>`${today()} ${nowTime()}`;
const monthStart=(d=new Date())=>fmt(new Date(d.getFullYear(),d.getMonth(),1));
const monthEnd=(d=new Date())=>fmt(new Date(d.getFullYear(),d.getMonth()+1,0));
const curYm=()=>today().slice(0,7);
const WEEK='日一二三四五六';
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3200)}

const CCOLORS=['#FFB7B2','#FF9AA2','#FFDAC1','#FFE6A7','#E2F0CB','#B5EAD7','#9ADBC4','#BFE3F5','#A8D0E6','#C7CEEA','#D7BDE2','#F8C8DC','#E8C1C5','#D4C4A8','#C9D5B5','#B8C5D6'];
const EMOJIS=['🍜','🍚','🍱','🍣','🍕','🍔','🍟','🌮','🍳','🥗','🍲','🍰','🍎','🍓',
'🧋','☕','🍵','🍺','🍷','🥤','🍦','🍩','🍪',
'🚇','🚌','🚗','🚕','🚲','✈️','🚄','⛽','🅿️',
'🛍️','👗','👟','👜','🎁','🛒',
'🎮','🎬','🎤','🎵','🎨','🏖️','🎢','📷',
'💊','🏥','🦷','💉',
'🐱','🐶','🐰','🐹','🐾',
'🧧','💐','🍼','💍',
'📱','💻','🎧','⌚','🖥️','🔌',
'🏠','🛋️','💡','🚿','🔧','💧','🔥','📶','🔨',
'💄','💅','💇','🧴','🪞',
'📚','✏️','🎓','📖','🏫',
'📈','💰','💹','🏦','🪙','💎',
'🎀','💼','👔','📦','📒',
'🌸','🌈','⭐','🧸','🧹','🎈','📺','🔔','🏕️','🧳'];

/* ========== 配置与状态 ========== */
const DEF_CFG={balanceSheet:true,txTime:false,txImage:false,txFlag:false,tags:true,reimb:false,display:'B',homeBudget:true,homeWeek:true,homeQuad:true,portalShow:true,portalUrl:'life.html',collapsed:{},order:[]};
function normSettings(s){const o={pinHash:'',dark:false,budget:0,autoSub:true,ledgerId:'l_daily',allView:false,hide:false,tpls:[],...(s||{})};o.cfg={...DEF_CFG,...(o.cfg||{})};o.cfg.collapsed={...(o.cfg.collapsed||{})};if(!Array.isArray(o.cfg.order))o.cfg.order=[];if(!Array.isArray(o.tpls))o.tpls=[];return o}
const DEF_LEDGER={id:'l_daily',name:'日常生活账本',icon:'📒',color:'#FFDAC1',budget:0,desc:'每天的吃喝玩乐'};
let S={accounts:[],categories:[],txs:[],subs:[],tags:[],tagGroups:[],plans:[],ledgers:[],settings:normSettings()};
let SY={token:'',gistId:'',auto:false,last:''};
let ACC=null;
let MK='';
const cfg=()=>S.settings.cfg;
const defaultF=()=>({kw:'',from:'',to:'',cats:[],acc:'',tag:'',flag:'',type:'',min:'',max:'',sort:'date-desc',limit:100});
let UI={tab:'dash',calMonth:new Date(new Date().getFullYear(),new Date().getMonth(),1),planYm:curYm(),catOpen:false,
  T:{mode:'flow',range:'month',type:'bar',metric:'net',from:'',to:'',y:'',m:''},F:defaultF()};
let db,fileHandle=null,fileState='none',lastSaved='',locked=false,charts={},TX={},SUBF={},CAT={},TG={},M={},LG={},modalSave=null,modalLock=false,AV='🐱';
let HP=false,skipPop=false,exitArm=0,EX={};

const ledOf=id=>S.ledgers.find(l=>l.id===id)||{icon:'📒',name:'未知账本',color:'#eee',budget:0};
const inL=o=>S.settings.allView||o.ledgerId===S.settings.ledgerId;
const vtx=()=>S.txs.filter(inL);
const vplans=()=>S.plans.filter(inL);
const defLedgerId=()=>S.settings.allView?(S.ledgers[0]?.id||'l_daily'):S.settings.ledgerId;
const curBudget=()=>S.settings.allView?S.ledgers.reduce((a,l)=>a+(+l.budget||0),0):(+ledOf(S.settings.ledgerId).budget||0);

const inStat=t=>!(cfg().txFlag&&t.noInc)&&!(cfg().reimb&&t.reimb);
const inBud=t=>inStat(t)&&!(cfg().txFlag&&t.noBud);

/* ========== IndexedDB（CreamLedgerDB） ========== */
const STORES=['accounts','categories','txs','subs','tags','tagGroups','plans','ledgers'];
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('CreamLedgerDB',1);
  r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'k'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const dbAll=s=>req(db.transaction(s).objectStore(s).getAll());
const dbGet=(s,k)=>req(db.transaction(s).objectStore(s).get(k));
const dbPut=(s,o)=>req(db.transaction(s,'readwrite').objectStore(s).put(o));
const dbDel=(s,id)=>req(db.transaction(s,'readwrite').objectStore(s).delete(id));
function dbReplaceAll(){return new Promise((res,rej)=>{const t=db.transaction(STORES,'readwrite');

async function migrateOld(){
  try{
    if(!indexedDB.databases)return false;
    const l=await indexedDB.databases();if(!l.some(d=>d.name==='cozy-ledger'))return false;
    const od=await new Promise((res,rej)=>{const r=indexedDB.open('cozy-ledger');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    const names=[...od.objectStoreNames];
    const get=s=>names.includes(s)?req(od.transaction(s).objectStore(s).getAll()):Promise.resolve([]);
    const [a,c,t,sb,tg,tgg,pl]=await Promise.all(['accounts','categories','txs','subs','tags','tagGroups','plans'].map(get));
    const st=names.includes('kv')?await req(od.transaction('kv').objectStore('kv').get('settings')):null;
    od.close();
    if(!a.length&&!t.length)return false;
    S.accounts=a;S.categories=c;S.txs=t;S.subs=sb;S.tags=tg;S.tagGroups=tgg;S.plans=pl;S.settings=normSettings(st?st.v:null);
    return true;
  }catch(e){return false}
}

function normalizeAll(){
  let ch=false;
  if(!S.ledgers.length){S.ledgers.push({...DEF_LEDGER});ch=true}
  const d0=(S.ledgers.find(l=>l.id==='l_daily')||S.ledgers[0]).id;
  S.ledgers.forEach(l=>{if(l.budget===undefined){l.budget=0;ch=true}if(!l.color){l.color=CCOLORS[2];ch=true}});
  if(+S.settings.budget>0&&!S.ledgers.some(l=>l.budget>0)){S.ledgers[0].budget=+S.settings.budget;S.settings.budget=0;ch=true}
  ['txs','plans','subs'].forEach(k=>S[k].forEach(o=>{if(!o.ledgerId||!S.ledgers.some(l=>l.id===o.ledgerId)){o.ledgerId=d0;ch=true}}));
  if(!S.ledgers.some(l=>l.id===S.settings.ledgerId)){S.settings.ledgerId=d0;ch=true}
  S.categories.forEach((c,i)=>{if(!c.color){c.color=CCOLORS[i%CCOLORS.length];ch=true}});
  const ids=new Set(S.tags.map(t=>t.id)),byName={};S.tags.forEach(t=>byName[t.name]=t);
  S.txs.forEach(t=>{
    if(!Array.isArray(t.tags)){t.tags=[];ch=true}
    t.tags=t.tags.map(x=>{
      if(ids.has(x))return x;
      if(!byName[x]){const n={id:'t_'+uid(),name:String(x),groupId:'',color:CCOLORS[S.tags.length%CCOLORS.length],active:true};S.tags.push(n);byName[x]=n;ids.add(n.id)}
      ch=true;return byName[x].id;
    });
  });
  return ch;
}

const snapshot=()=>({app:'cream-ledger',version:4,exportedAt:nowStr(),ledgers:S.ledgers,accounts:S.accounts,categories:S.categories,txs:S.txs,subs:S.subs,tags:S.tags,tagGroups:S.tagGroups,plans:S.plans,settings:S.settings});
let fileTimer;
function queueFile(){if(!fileHandle||fileState!=='ok')return;clearTimeout(fileTimer);fileTimer=setTimeout(writeFile,300)}
async function writeFile(){
  try{const w=await fileHandle.createWritable();await w.write(JSON.stringify(snapshot(),null,1));await w.close()}
  catch(e){fileState='need';toast('本地文件写入失败，请点击按钮重新授权 🔑')}
  renderStatus();
}
const validData=d=>d&&!d.partial&&Array.isArray(d.txs)&&Array.isArray(d.accounts)&&Array.isArray(d.categories);
async function connectFile(){
  if(!window.showOpenFilePicker){toast('当前浏览器不支持直连文件，请使用导出/导入备份（推荐电脑端 Chrome / Edge）');return}
  try{
    if(fileHandle&&fileState==='need'){
      if(await fileHandle.requestPermission({mode:'readwrite'})==='granted'){fileState='ok';await writeFile();toast('已重新连接 ✨')}
      return;
    }
    const useExisting=confirm('连接本地账本文件：\n【确定】选择已有的 .json 账本\n【取消】新建一个账本文件');
    const types=[{description:'账本 JSON',accept:{'application/json':['.json']}}];
    let h;
    if(useExisting){[h]=await showOpenFilePicker({types})}
    else{h=await showSaveFilePicker({suggestedName:'小账本.json',types})}
    if(await h.requestPermission({mode:'readwrite'})!=='granted')return;
    if(useExisting){
      const txt=await(await h.getFile()).text();
      if(txt.trim()){
        let d=null;try{d=JSON.parse(txt)}catch(e){}
        if(validData(d)){
          if(confirm('文件中已有账本数据。\n【确定】用文件数据覆盖当前浏览器数据\n【取消】保留当前数据并写入文件'))await loadData(d);
        }else if(!confirm('该文件不是有效的账本文件，是否用当前数据覆盖它？'))return;
      }
    }
    fileHandle=h;fileState='ok';
    await dbPut('kv',{k:'handle',h});
    await writeFile();render();toast('已连接，之后每次修改都会自动保存 ✨');
  }catch(e){if(e.name!=='AbortError')toast('连接失败：'+e.message)}
}

function applyTx(b,t){
  if(t.type==='expense'){if(t.accId in b)b[t.accId]-=t.amount}
  else if(t.type==='income'){if(t.accId in b)b[t.accId]+=t.amount}
  else{if(t.accId in b)b[t.accId]-=t.amount;if(t.toAccId in b)b[t.toAccId]+=t.amount}
}

function budSpent(){const f=monthStart(),t=monthEnd();let e=0;vtx().forEach(x=>{if(x.type==='expense'&&x.date>=f&&x.date<=t&&inBud(x))e+=x.amount});return e}

function calcEval(s){
  s=String(s).replace(/×/g,'*').replace(/÷/g,'/').replace(/[−－]/g,'-').replace(/＋/g,'+').replace(/\s+/g,'');
  if(!s||!/^[0-9+\-*/().]+$/.test(s))return NaN;
  let i=0;
  const num=()=>{
    if(s[i]==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return v}
    const st=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;
    const sl=s.slice(st,i);if(!/^(\d+\.?\d*|\.\d+)$/.test(sl))throw 0;return parseFloat(sl);
  };
  const unary=()=>{if(s[i]==='-'){i++;return -unary()}if(s[i]==='+'){i++;return unary()}return num()};
  const term=()=>{let v=unary();while(s[i]==='*'||s[i]==='/'){const o=s[i++];const r=unary();v=o==='*'?v*r:v/r}return v};
  const expr=()=>{let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v};
  try{const v=expr();if(i!==s.length||!isFinite(v))return NaN;return Math.round(v*100)/100}catch(e){return NaN}
}

/* ========== 周期订阅 ========== */
function dueMatch(s,d){
  const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  if(s.cycle==='week')return d.getDay()===+s.day;
  if(s.cycle==='month')return d.getDate()===Math.min(+s.day,dim);
  return d.getMonth()+1===+s.month&&d.getDate()===Math.min(+s.day,dim);
}
function nextDue(s){
  let from=new Date();from.setHours(0,0,0,0);
  const lr=addDays(parseD(s.lastRun),1);if(lr>from)from=lr;
  for(let i=0;i<800;i++){const d=addDays(from,i);if(dueMatch(s,d))return d}
  return null;
}
const daysUntil=d=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)};
const cycleText=s=>s.cycle==='month'?`每月${s.day}日`:s.cycle==='week'?`每周${WEEK[s.day]}`:`每年${s.month}月${s.day}日`;
const monthlyOf=s=>s.cycle==='month'?s.amount:s.cycle==='year'?s.amount/12:s.amount*52/12;
async function runSubs(){
  let n=0;const td=new Date();td.setHours(0,0,0,0);
  for(const s of S.subs){
    if(!s.active)continue;
    for(let d=addDays(parseD(s.lastRun),1);d<=td;d=addDays(d,1)){
      if(dueMatch(s,d)){S.txs.push(mkSubTx(s,fmt(d)));n++}
    }
    if(s.lastRun!==fmt(td)){s.lastRun=fmt(td)}
  }
  if(n){await saveAll();toast(`已自动入账 ${n} 笔固定收支 🔄`)}
  else if(S.subs.length)await dbReplaceAll();
}
const mkSubTx=(s,date)=>({id:uid(),ledgerId:s.ledgerId||S.ledgers[0].id,type:s.type,amount:s.amount,catId:s.catId,accId:s.accId,toAccId:'',date,time:'',tags:S.tags.some(t=>t.id==='t_sub')?['t_sub']:[],note:s.name,ts:Date.now(),subId:s.id,img:'',noInc:false,noBud:false,reimb:''});
async function payNow(id){
  const s=S.subs.find(x=>x.id===id);if(!s)return;const nd=nextDue(s);
  const tx=mkSubTx(s,today());tx.time=nowTime();S.txs.push(tx);if(nd)s.lastRun=fmt(nd);
  await saveAll();render();toast(`「${s.name}」已入账 ✨`);
}

/* ========== 手机端手势：账单行左右滑 ========== */
const SW={el:null,open:null,x0:0,y0:0,base:0,dir:'',dx:0,block:false};
const ACTW=232;
function swClose(el){if(!el)return;el.style.transition='transform .3s cubic-bezier(.34,1.56,.64,1)';el.style.transform='';if(SW.open===el)SW.open=null}
document.addEventListener('touchstart',e=>{
  if(window.innerWidth>=768||locked)return;
  const row=e.target.closest?e.target.closest('.swr>.row'):null;
  if(SW.open&&SW.open!==row)swClose(SW.open);
  if(!row){SW.el=null;return}
  const t=e.touches[0];SW.el=row;SW.x0=t.clientX;SW.y0=t.clientY;SW.dir='';SW.dx=0;SW.base=SW.open===row?-ACTW:0;row.style.transition='none';
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!SW.el)return;
  const t=e.touches[0],dx=t.clientX-SW.x0,dy=t.clientY-SW.y0;
  if(!SW.dir){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;SW.dir=Math.abs(dx)>Math.abs(dy)?'h':'v'}
  if(SW.dir!=='h')return;
  e.preventDefault();SW.dx=dx;
  let x=SW.base+dx;
  if(x<-ACTW)x=-ACTW-(-ACTW-x)*0.2;
  if(x>0)x=x*0.4;
  SW.el.style.transform=`translateX(${x}px)`;
},{passive:false});
function swEnd(){
  const row=SW.el;if(!row)return;SW.el=null;
  if(SW.dir!=='h')return;
  SW.block=true;setTimeout(()=>{SW.block=false},350);
  const dx=SW.dx,id=row.dataset.id;
  row.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1)';
  if(SW.base===0&&dx<-50){row.style.transform=`translateX(${-ACTW}px)`;SW.open=row}
  else if(SW.base<0&&dx>30){row.style.transform='';SW.open=null}
  else if(SW.base===0&&dx>50){
    row.style.transform='';
    try{row.animate([{transform:'translateX(70px)'},{transform:'translateX(-16px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:520,easing:'ease-out'})}catch(e){}
    setTimeout(()=>cloneToday(id),280);
  }
  else row.style.transform=SW.base<0?`translateX(${-ACTW}px)`:'';
}
document.addEventListener('touchend',swEnd);
document.addEventListener('touchcancel',swEnd);
function rowClick(ev,id){
  if(SW.block){ev.stopPropagation();return}
  if(SW.open){swClose(SW.open);return}
  txDetail(id);
}
function swAct(kind,id){

async function cloneToday(id){
  const t=S.txs.find(x=>x.id===id);if(!t)return;

  delete n.subId;delete n.reimbOf;delete n.settledAt;

}

/* ========== 手机端手势：弹窗下滑关闭 ========== */
let SD=null;
(function(){
  const box=$('#modalBox');
  box.addEventListener('touchstart',e=>{
    if(window.innerWidth>=768){SD=null;return}
    const r=box.getBoundingClientRect(),t=e.touches[0];
    if(t.clientY-r.top>64){SD=null;return}
    SD={y0:t.clientY,dy:0};box.style.transition='none';
  },{passive:true});
  box.addEventListener('touchmove',e=>{
    if(!SD)return;
    const dy=e.touches[0].clientY-SD.y0;
    if(dy<=0){SD.dy=0;box.style.transform='';return}
    e.preventDefault();SD.dy=dy;box.style.transform=`translateY(${dy}px)`;
  },{passive:false});
  const end=()=>{
    if(!SD)return;const dy=SD.dy;SD=null;
    if(dy>80&&!modalLock){
      box.style.transition='transform .22s ease-in';box.style.transform='translateY(100%)';
      setTimeout(()=>{closeModal();box.style.transition='';box.style.transform=''},200);
    }else{
      if(dy>80&&modalLock)toast('请先确认已保存恢复密钥 🔑');
      box.style.transition='transform .3s cubic-bezier(.34,1.56,.64,1)';box.style.transform='';
    }
  };
  box.addEventListener('touchend',end);box.addEventListener('touchcancel',end);
})();

/* ========== 图片压缩 ========== */
function compressImg(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=()=>rej(new Error('读取失败'));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('不是有效的图片'));
    im.onload=()=>{const w=Math.min(800,im.width),h=Math.max(1,Math.round(im.height*w/im.width));
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',0.7))};
    im.src=fr.result};
  fr.readAsDataURL(file)})}
async function onImg(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  try{TX.img=await compressImg(f);drawImg();toast('图片已压缩 🖼️')}catch(e){toast('图片处理失败：'+e.message)}
}
function drawImg(){
  $('#tx_imgprev').innerHTML=TX.img?`<div class="flex items-center gap-2 mt-2"><img src="${TX.img}" alt="预览" style="height:70px;border-radius:.8rem"><button class="btn btn-sm" type="button" onclick="TX.img='';drawImg()">移除</button></div>`:'';
}

}

function txType(t){TX.type=t;drawTx()}
function txCat(id){TX.catId=id;drawTx()}
function drawTx(){
  const names={expense:'💸 支出',income:'💰 收入',transfer:'🔁 转账'};
  $('#tx_types').innerHTML=Object.entries(names).map(([k,n])=>`<span class="chip ${TX.type===k?'on':''}" onclick="txType('${k}')">${n}</span>`).join('');
  const isT=TX.type==='transfer';
  $('#tx_catwrap').style.display=isT?'none':'';
  $('#tx_towrap').style.display=isT?'':'none';
  $('#tx_acclbl').textContent=isT?'转出账户':'账户';
  const rw=$('#tx_reimbwrap');if(rw)rw.style.display=TX.type==='expense'?'':'none';
  if(!isT){
    const cats=S.categories.filter(c=>c.type===TX.type);
    if(!cats.some(c=>c.id===TX.catId))TX.catId=cats[0]?.id||'';
    $('#tx_cats').innerHTML=cats.length?cats.map(c=>`<span class="chip ${c.id===TX.catId?'on':''}" onclick="txCat('${c.id}')">${c.icon} ${esc(c.name)}</span>`).join(''):'<span class="sub text-sm">暂无分类，请先到「设置」添加</span>';
  }
}
function toggleTxTag(id){const i=TX.tags.indexOf(id);i>=0?TX.tags.splice(i,1):TX.tags.push(id);drawTxTags()}
function drawTxTags(){
  const usable=S.tags.filter(t=>t.active||TX.tags.includes(t.id));
  if(!usable.length){$('#tx_tagpick').innerHTML='<span class="sub text-sm">还没有可用标签，可在下方直接新建</span>';return}
  const groups=[...S.tagGroups,{id:'',name:'未分组'}];
  $('#tx_tagpick').innerHTML=groups.map(g=>{
    const ts=usable.filter(t=>(t.groupId||'')===g.id);if(!ts.length)return '';
    return `<div class="text-xs sub mt-1">${esc(g.name)}</div><div class="flex flex-wrap gap-2 mt-1">${ts.map(t=>`<span class="chip ${TX.tags.includes(t.id)?'on':''} ${t.active?'':'off'}" style="${TX.tags.includes(t.id)?'':'border-color:'+t.color}" onclick="toggleTxTag('${t.id}')">#${esc(t.name)}</span>`).join('')}</div>`;
  }).join('');
}
async function saveTx(){
  const amount=calcEval($('#tx_amt').value);
  if(!(amount>0)){toast('请输入大于 0 的金额或有效算式 🍬');return false}
  const accId=$('#tx_acc').value,toAccId=$('#tx_to').value,date=$('#tx_date').value;
  if(!date){toast('请选择日期');return false}
  if(TX.type==='transfer'){if(accId===toAccId){toast('转出和转入账户不能相同哦');return false}}
  else if(!TX.catId){toast('请选择一个分类');return false}
  const old=TX.id?S.txs.find(x=>x.id===TX.id):null;
  let tags=[...TX.tags];
  if(cfg().tags){
    const names=($('#tx_newtags')?.value||'').split(/[\s,，#]+/).filter(Boolean);
    for(const n of new Set(names)){
      let ex=S.tags.find(t=>t.name===n);
      if(!ex){ex={id:'t_'+uid(),name:n,groupId:'',color:CCOLORS[S.tags.length%CCOLORS.length],active:true};await saveItem('tags',ex)}
      if(!tags.includes(ex.id))tags.push(ex.id);
    }
  }else if(old)tags=old.tags||[];
  let time;
  if(cfg().txTime){time=$('#tx_time').value||'';if(time.length===5)time+=':00'}
  else time=old?(old.time||''):nowTime();
  const isT=TX.type==='transfer';
  let reimb=old?(old.reimb||''):'';
  if(cfg().reimb&&reimb!=='done')reimb=(TX.type==='expense'&&TX.reimb==='pending')?'pending':'';
  if(TX.type!=='expense'&&reimb!=='done')reimb='';
  await saveItem('txs',{...(old||{}),id:TX.id||uid(),ledgerId:$('#tx_led').value,type:TX.type,amount,catId:isT?'':TX.catId,accId,toAccId:isT?toAccId:'',date,time,tags,note:$('#tx_note').value.trim(),ts:old?old.ts:Date.now(),subId:old?.subId,
    img:cfg().txImage?TX.img:(old?old.img||'':''),noInc:cfg().txFlag?TX.noInc:(old?!!old.noInc:false),noBud:cfg().txFlag?TX.noBud:(old?!!old.noBud:false),reimb});
  render();toast('已记下啦 ✨');
}
async function delTx(id){if(!confirm('确定删除这笔账单吗？'))return;await delItem('txs',id);closeModal();render();toast('已删除')}
async function moveTx(id){

/* ========== ⚡ 秒记模板 ========== */
function drawTpls(){
  const el=$('#tx_tpls');if(!el)return;
  const L=S.settings.tpls||[];
  el.innerHTML=L.map(t=>`<span class="chip" onclick="applyTpl('${t.id}')">${t.type==='transfer'?'🔁':catOf(t.catId).icon} ${esc(t.name)}${t.amount?` <span class="tnum sub">${t.amount}</span>`:''} <i class="fa-solid fa-xmark sub" onclick="event.stopPropagation();delTpl('${t.id}')" aria-label="删除模板"></i></span>`).join('')
   +`<span class="chip" style="border-style:dashed" onclick="saveTpl()">💾 存为模板</span>`;
}
function applyTpl(id){
  const t=(S.settings.tpls||[]).find(x=>x.id===id);if(!t)return;
  TX.type=t.type;TX.catId=t.catId||'';TX.tags=(t.tags||[]).filter(x=>tagOf(x));
  drawTx();
  $('#tx_amt').value=t.amount||'';calcHint();
  if(S.accounts.some(a=>a.id===t.accId))$('#tx_acc').value=t.accId;
  if(t.toAccId&&S.accounts.some(a=>a.id===t.toAccId))$('#tx_to').value=t.toAccId;
  $('#tx_note').value=t.note||'';
  if(S.ledgers.some(l=>l.id===t.ledgerId))$('#tx_led').value=t.ledgerId;
  if(cfg().tags)drawTxTags();
  toast('已套用模板 ⚡ 检查一下金额就能保存啦');
}
async function saveTpl(){
  if((S.settings.tpls||[]).length>=20){toast('模板最多 20 个，请先删除一些');return}
  const amt=calcEval($('#tx_amt').value);
  const note=$('#tx_note').value.trim();
  const def=note||(TX.type==='transfer'?'转账':catOf(TX.catId).name);
  const name=prompt('给这个模板起个名字：',def);if(name===null)return;
  const nm=name.trim();if(!nm){toast('模板名不能为空');return}
  S.settings.tpls=[...(S.settings.tpls||[]),{id:uid(),name:nm,type:TX.type,catId:TX.type==='transfer'?'':TX.catId,amount:isNaN(amt)?'':amt,accId:$('#tx_acc').value,toAccId:TX.type==='transfer'?$('#tx_to').value:'',note,ledgerId:$('#tx_led').value,tags:[...TX.tags]}];
  await saveSettings();drawTpls();toast('模板已保存 ⚡');
}
async function delTpl(id){
  S.settings.tpls=(S.settings.tpls||[]).filter(x=>x.id!==id);
  await saveSettings();drawTpls();
}

/* ========== 看板（可折叠 + 可排序面板） ========== */
const PDEF={
  core:['🍯 本月核心指标',()=>coreHtml(),true],
  budget:['🎯 月度预算',()=>budgetHtml(),false],
  week:['🗓️ 本周汇总',()=>weekHtml(),false],
  reimb:['💸 待报销 / 待收款',()=>reimbHtml(),true],
  trend:['📈 趋势大看板',()=>trendHtml(),true],
  donut:['🍩 本月支出分类',()=>`<div class="text-xs sub mb-1">点击扇区查看明细</div><div style="height:280px" id="donutWrap"><canvas id="chDonut"></canvas></div>`,false],
  balance:['⚖️ 资产负债表',()=>balHtml(),false],
  quad:['📌 本月金钱规划',()=>quadHtml(),true],
  recent:['🧾 近期账单',()=>recentHtml(),true]
};
const PVIS={budget:()=>cfg().homeBudget,week:()=>cfg().homeWeek,reimb:()=>cfg().reimb,balance:()=>cfg().balanceSheet,quad:()=>cfg().homeQuad};
function normOrder(){
  const keys=Object.keys(PDEF),o=(cfg().order||[]).filter(k=>keys.includes(k));
  const seen=new Set(o);keys.forEach(k=>{if(!seen.has(k))o.push(k)});
  return o;
}
const visPanels=()=>normOrder().filter(id=>!PVIS[id]||PVIS[id]());
function movePanel(id,dir){
  const vis=visPanels(),i=vis.indexOf(id),j=i+dir;
  if(i<0||j<0||j>=vis.length)return;
  const o=normOrder(),a=o.indexOf(vis[i]),b=o.indexOf(vis[j]);
  [o[a],o[b]]=[o[b],o[a]];
  cfg().order=o;saveSettings();render();
}
function dropPanel(from,to){
  if(!from||!to||from===to||!PDEF[from])return;
  const o=normOrder().filter(x=>x!==from),k=o.indexOf(to);
  if(k<0)return;
  o.splice(k,0,from);cfg().order=o;saveSettings();render();
}
function resetOrder(){cfg().order=[];saveSettings();render();toast('已恢复默认板块顺序')}
function panel(id,title,fn,span){
  const col=!!cfg().collapsed[id];
  return `<div class="card p-4 ${span?'lg:col-span-2':''}" data-pid="${id}" ondragover="event.preventDefault()" ondrop="dropPanel(event.dataTransfer.getData('text/plain'),'${id}')"><div class="flex items-center gap-1">
   <span class="sub dsk select-none" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${id}')" title="拖拽到其他卡片上排序" style="cursor:grab;padding:0 .35rem">⠿</span>
   <b class="mr-auto">${title}</b>
   <button class="btn btn-sm" onclick="movePanel('${id}',-1)" aria-label="上移">⬆️</button><button class="btn btn-sm" onclick="movePanel('${id}',1)" aria-label="下移">⬇️</button>
   <button class="btn btn-sm" onclick="toggleCol('${id}')" aria-expanded="${!col}">${col?'🔽 展开':'🔼 收起'}</button></div>
   ${col?'':`<div class="mt-3">${fn()}</div>`}</div>`;
}
function toggleCol(id){cfg().collapsed[id]=!cfg().collapsed[id];saveSettings();render()}
function viewDash(){

function budgetHtml(){
  const bud=curBudget(),sp=budSpent(),pct=bud?Math.min(100,sp/bud*100):0,over=bud&&sp>bud;

   <div class="text-sm tnum ${over?'exp':''}">${bud?(over?`超支 ${money(sp-bud)} 🥺 要温柔对待钱包哦`:`还剩 ${money(bud-sp)}（${pct.toFixed(0)}%）`):'未设置预算'}</div></div>`;

function weekHtml(){
  const now=new Date();now.setHours(0,0,0,0);
  const mon=addDays(now,-((now.getDay()+6)%7));let te=0,ti=0,cells='';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),k=fmt(d),s=stat(k,k);te+=s.e;ti+=s.i;
    cells+=`<div class="rounded-2xl p-1 sm:p-2 text-center" style="background:var(--bg);${k===today()?'outline:2px solid var(--pink)':''}"><div class="text-xs sub">周${WEEK[d.getDay()]}</div><div class="text-xs sub">${k.slice(8)}</div><div class="exp tnum text-xs sm:text-sm">${s.e?'-'+s.e.toFixed(0):'·'}</div><div class="inc tnum text-xs sm:text-sm">${s.i?'+'+s.i.toFixed(0):'·'}</div></div>`;
  }
  const last=stat(fmt(addDays(mon,-7)),fmt(addDays(mon,-1)));
  const ch=last.e>0?(te-last.e)/last.e*100:null;
  const chTxt=ch===null?'上周无支出记录':ch>0?`比上周多花 ${ch.toFixed(0)}% 📈`:ch<0?`比上周少花 ${Math.abs(ch).toFixed(0)}% 🎉`:'与上周持平';
  return `<div class="grid grid-cols-7 gap-1 mb-2">${cells}</div>
   <div class="text-sm tnum">本周支出 <b class="exp">${money(te)}</b> · 收入 <b class="inc">${money(ti)}</b></div>
   <div class="text-xs sub tnum">上周支出 ${money(last.e)} · ${chTxt}</div>`;
}

  return `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

function trendYM(){
  const y=$('#t_y').value,m=$('#t_m').value;UI.T.y=y;UI.T.m=m;
  if(y){
    if(m){UI.T.from=`${y}-${pad(m)}-01`;UI.T.to=fmt(new Date(+y,+m,0))}
    else{UI.T.from=`${y}-01-01`;UI.T.to=`${y}-12-31`}
  }
  render();
}
function rangeOf(){
  const now=new Date(),T=UI.T;
  if(T.range==='7d')return{from:fmt(addDays(now,-6)),to:today()};
  if(T.range==='month')return{from:monthStart(),to:monthEnd()};
  if(T.range==='year')return{from:`${now.getFullYear()}-01-01`,to:`${now.getFullYear()}-12-31`};
  let f=T.from||monthStart(),t=T.to||monthEnd();if(f>t)[f,t]=[t,f];return{from:f,to:t};
}
function buckets(r){
  const f=parseD(r.from),days=Math.round((parseD(r.to)-f)/864e5)+1,bs=[];
  if(days<=62){for(let i=0;i<days;i++){const k=fmt(addDays(f,i));bs.push({label:k.slice(5),start:k,end:k})}return{bs,daily:true}}
  const oneYear=r.from.slice(0,4)===r.to.slice(0,4);
  let d=new Date(f.getFullYear(),f.getMonth(),1);
  while(fmt(d)<=r.to){
    const s=fmt(d)<r.from?r.from:fmt(d),eM=fmt(new Date(d.getFullYear(),d.getMonth()+1,0)),e=eM>r.to?r.to:eM;
    bs.push({label:oneYear?`${d.getMonth()+1}月`:`${d.getFullYear()}-${pad(d.getMonth()+1)}`,start:s,end:e});
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
  return{bs,daily:false};
}
function metricOf(b,m){
  const v=Object.values(b);
  if(m==='net')return v.reduce((a,x)=>a+x,0);
  if(m==='asset')return v.filter(x=>x>0).reduce((a,x)=>a+x,0);
  if(m==='debt')return v.filter(x=>x<0).reduce((a,x)=>a-x,0);
  return b[m.slice(4)]??0;
}
function drawTrend(){
  const cv=$('#chTrend');if(!cv)return;
  const T=UI.T,r=rangeOf(),{bs,daily}=buckets(r),line=T.type==='line';
  const mk=(label,data,color)=>line?{label,data,borderColor:color,backgroundColor:color+'44',fill:true,tension:.4,pointRadius:bs.length>40?0:3,spanGaps:false}:{label,data,backgroundColor:color,borderRadius:10,borderSkipped:false};
  let datasets;
  if(T.mode==='flow'){
    const idx={};bs.forEach((b,i)=>idx[daily?b.start:b.start.slice(0,7)]=i);
    const e=bs.map(()=>0),inc=bs.map(()=>0);
    vtx().forEach(t=>{
      if(t.date<r.from||t.date>r.to||!inStat(t))return;
      const i=idx[daily?t.date:t.date.slice(0,7)];if(i===undefined)return;
      if(t.type==='expense')e[i]+=t.amount;else if(t.type==='income')inc[i]+=t.amount;
    });
    datasets=[mk('支出',e.map(x=>+x.toFixed(2)),'#FF9AA2'),mk('收入',inc.map(x=>+x.toFixed(2)),'#8fdcbf')];
  }else{
    const b=initBal(),txs=[...S.txs].sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0),td=today();let p=0;const data=[];
    for(const bk of bs){
      if(bk.end>td){data.push(null);continue}
      while(p<txs.length&&txs[p].date<=bk.end){applyTx(b,txs[p]);p++}
      data.push(+metricOf(b,T.metric).toFixed(2));
    }
    const names={net:'净资产',asset:'总资产',debt:'总负债'};
    const acc=T.metric.startsWith('acc:')?S.accounts.find(a=>a.id===T.metric.slice(4)):null;
    const color=T.metric==='asset'?'#7fd8b6':T.metric==='debt'?'#FF9AA2':T.metric==='net'?'#9aa5d8':'#e0a96d';
    datasets=[mk(acc?acc.name+' 余额':names[T.metric],data,color)];
  }
  charts.t=new Chart(cv,{type:line?'line':'bar',data:{labels:bs.map(b=>b.label),datasets},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{usePointStyle:true,pointStyle:'circle'}}},
      scales:{y:{beginAtZero:T.mode==='flow',grid:{color:'rgba(160,140,130,.12)'}},x:{grid:{display:false},ticks:{maxTicksLimit:12}}}}});
}
function drawCharts(){
  if(typeof Chart==='undefined'){$('#view').insertAdjacentHTML('beforeend','<p class="sub text-center mt-4">图表库未能加载（需要联网加载 Chart.js）</p>');return}
  drawTrend();
  const dc=$('#chDonut');if(!dc)return;

function toggleFcat(id){const a=UI.F.cats,i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);UI.F.limit=100;render()}
function filtered(){
  const F=UI.F,k=F.kw.trim().toLowerCase().replace(/^#/,'');
  const min=F.min===''?null:parseFloat(F.min),max=F.max===''?null:parseFloat(F.max);
  let a=vtx().filter(t=>{
    if(F.from&&t.date<F.from)return false;if(F.to&&t.date>F.to)return false;
    if(F.type&&t.type!==F.type)return false;
    if(F.cats.length&&!F.cats.includes(t.catId))return false;
    if(F.acc&&t.accId!==F.acc&&t.toAccId!==F.acc)return false;
    if(F.tag&&!(t.tags||[]).includes(F.tag))return false;
    if(F.flag==='noInc'&&!t.noInc)return false;if(F.flag==='noBud'&&!t.noBud)return false;if(F.flag==='any'&&!t.noInc&&!t.noBud)return false;
    if(F.flag==='rp'&&t.reimb!=='pending')return false;if(F.flag==='rd'&&t.reimb!=='done')return false;
    if(min!==null&&!isNaN(min)&&t.amount<min-1e-9)return false;
    if(max!==null&&!isNaN(max)&&t.amount>max+1e-9)return false;
    if(k){
      const cn=t.type==='transfer'?'转账':catOf(t.catId).name.toLowerCase();
      const hit=cn.includes(k)||(t.note||'').toLowerCase().includes(k)||(t.tags||[]).some(id=>(tagOf(id)?.name||'').toLowerCase().includes(k));
      if(!hit)return false;
    }
    return true;
  });
  const s=F.sort,dt=t=>t.date+' '+(t.time||'');
  a.sort((x,y)=>s==='date-desc'?(dt(y).localeCompare(dt(x))||y.ts-x.ts):s==='date-asc'?(dt(x).localeCompare(dt(y))||x.ts-y.ts):s==='amt-desc'?y.amount-x.amount:x.amount-y.amount);
  return a;
}
function updateList(){

  a.forEach(t=>{if(!inStat(t))return;const d=day[t.date]=day[t.date]||{e:0,i:0};if(t.type==='expense'){e+=t.amount;d.e+=t.amount}else if(t.type==='income'){i+=t.amount;d.i+=t.amount}});

function exList(){
  const k=EX.kw.trim().toLowerCase().replace(/^#/,'');
  let from=EX.from,to=EX.to;
  if(!from&&!to){
    const yy=EX.y||(EX.m?String(new Date().getFullYear()):'');
    if(yy){
      if(EX.m){from=`${yy}-${pad(EX.m)}-01`;to=fmt(new Date(+yy,+EX.m,0))}
      else{from=`${yy}-01-01`;to=`${yy}-12-31`}
    }
  }
  return S.txs.filter(t=>{
    if(EX.leds.length&&!EX.leds.includes(t.ledgerId))return false;
    if(from&&t.date<from)return false;if(to&&t.date>to)return false;
    if(EX.type&&t.type!==EX.type)return false;
    if(EX.cats.length&&!EX.cats.includes(t.catId))return false;
    if(EX.acc&&t.accId!==EX.acc&&t.toAccId!==EX.acc)return false;
    if(k){
      const cn=t.type==='transfer'?'转账':catOf(t.catId).name.toLowerCase();
      if(!(cn.includes(k)||(t.note||'').toLowerCase().includes(k)||(t.tags||[]).some(id=>(tagOf(id)?.name||'').toLowerCase().includes(k))))return false;

/* =====================================================================
   🌸 本地账户 / 主密钥（信封加密）/ 登录 / 找回
   - MasterKey：随机 32 字节，只在登录后驻留内存
   - wrapPwd ：登录密码 包装 MasterKey
   - wrapA   ：账号 + 两个密保答案 包装 MasterKey（方式 A）
   - wrapB1/2：恢复密钥 + 任意一个密保答案 包装 MasterKey（方式 B）
   ===================================================================== */
let LM='acc',RKshow='',askRes=null,ADOPT=null,FG={method:'A'},FGMK=null,LOGIN={fails:0,until:0};
const QPRESET=['我最喜欢的食物是什么？','我宠物的名字是什么？','我小学的校名是什么？','我最好朋友的名字是什么？','我出生的城市是哪里？','我最喜欢的一部电影是什么？','我第一份工作的公司是什么？','我最难忘的一次旅行去了哪里？'];
const AVATARS=['🐱','🐶','🐰','🐻','🦊','🐼','🐨','🐹','🦄','🐣','🐙','🐳','🍑','🍓','🌸','🍰','🧸','⭐','🌙','☁️','🦋','🐸','🐷','🍵'];

const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const u8text=t=>new TextEncoder().encode(t);
const cryptoOk=()=>{if(!(window.crypto&&crypto.subtle)){toast('当前环境不支持加密（需要 https 或直接打开本地文件）');return false}return true};
async function aesKey(secret,salt){
  const km=await crypto.subtle.importKey('raw',u8text(secret),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function wrapKey(bytes,secret){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(secret,salt),bytes);
  return{s:b64(salt),i:b64(iv),c:b64(new Uint8Array(ct))};
}
async function unwrapKey(w,secret){
  if(!w)throw new Error('bad');
  try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.i)},await aesKey(secret,unb64(w.s)),unb64(w.c));return new Uint8Array(pt)}
  catch(e){throw new Error('bad')}
}
const normA=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');
const normRK=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const secP=pw=>'P|'+pw;
const secA=(ident,a1,a2)=>'A|'+normA(ident)+'|'+normA(a1)+'|'+normA(a2);
const secB=(rk,a)=>'B|'+normRK(rk)+'|'+normA(a);
function genRK(){
  const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(25));
  let s='';r.forEach((x,i)=>{s+=al[x&31];if(i%5===4&&i<24)s+='-'});return s;
}
const saveMe=async()=>{await dbPut('kv',{k:'account',v:ACC});afterWrite()};
const pwOk=(a,b)=>{if(a.length<6){toast('登录密码至少 6 位');return false}if(a!==b){toast('两次输入的密码不一致');return false}return true};

function askPass(title){
  return new Promise(res=>{
    askRes=res;
    openModal(title,`<label class="lbl">登录密码</label><input id="ap_pw" type="password" class="inp" autocomplete="current-password">`,async()=>{
      const v=$('#ap_pw').value;const r=askRes;askRes=null;if(r)r(v);
    },{okText:'确定'});
  });
}
async function getMK(silent){
  if(MK)return MK;
  if(!ACC||silent)return '';
  const pw=await askPass('🔐 解锁主密钥：请输入登录密码');
  if(pw===null)return '';
  try{MK=b64(await unwrapKey(ACC.wrapPwd,secP(pw)));return MK}
  catch(e){toast('登录密码不正确');return ''}
}

/* ---- 同步数据的打包 / 解包（用 MasterKey 加密） ---- */
const pubAcc=()=>{const a={...ACC};delete a.protect;return a};
async function encPack(text){
  if(!(SY.enc&&ACC))return JSON.stringify({v:2,enc:0,data:text});
  if(!cryptoOk())throw new Error('无法加密');
  const mk=await getMK(false);
  if(!mk)throw new Error('未解锁主密钥，已取消');
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(mk,salt),u8text(text));
  return JSON.stringify({v:2,enc:1,salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ct)),acc:pubAcc()});
}
async function decPack(str){
  ADOPT=null;
  const o=JSON.parse(str);
  if(!o.enc)return o.data;
  if(!cryptoOk())throw new Error('无法解密');
  const tryDec=async m=>{
    try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await aesKey(m,unb64(o.salt)),unb64(o.data));return new TextDecoder().decode(pt)}
    catch(e){throw new Error('bad')}
  };
  if(MK){try{return await tryDec(MK)}catch(e){}}
  if(!o.acc)throw new Error('数据已加密，请先登录账户');
  const pw=await askPass('这份数据由账户「'+(o.acc.name||'')+'」加密，请输入该账户的登录密码');
  if(pw===null)throw new Error('已取消');
  let mkb;try{mkb=await unwrapKey(o.acc.wrapPwd,secP(pw))}catch(e){throw new Error('登录密码不正确')}
  const m=b64(mkb);
  let txt;try{txt=await tryDec(m)}catch(e){throw new Error('解密失败：数据已损坏')}
  ADOPT={acc:o.acc,mk:m};
  return txt;
}
async function applyAdopt(){
  if(!ADOPT)return;
  ACC={...ADOPT.acc,protect:ACC?ACC.protect!==false:true};MK=ADOPT.mk;ADOPT=null;
  await dbPut('kv',{k:'account',v:ACC});
}

function qaRead(){
  const r={};
  for(const n of [1,2]){
    const s=$('#me_qs'+n).value,q=s==='__c'?$('#me_qc'+n).value.trim():s,a=$('#me_a'+n).value;

    r['q'+n]=q;r['a'+n]=a;
  }
  if(r.q1===r.q2){toast('两个密保问题不能相同');return null}
  if(normA(r.a1)===normA(r.a2)){toast('两个答案不能相同');return null}
  return r;
}
async function meBuild(o){
  const mkb=o.mkBytes||crypto.getRandomValues(new Uint8Array(32)),rk=genRK(),qa=o.qa;
  const acc={name:o.name,ident:o.ident,avatar:o.avatar,q1:qa.q1,q2:qa.q2,protect:o.protect!==false,created:o.created||nowStr(),
    wrapPwd:await wrapKey(mkb,secP(o.pw)),
    wrapA:await wrapKey(mkb,secA(o.ident,qa.a1,qa.a2)),
    wrapB1:await wrapKey(mkb,secB(rk,qa.a1)),
    wrapB2:await wrapKey(mkb,secB(rk,qa.a2))};
  return{acc,mk:b64(mkb),rk};
}

function rescueCard(){
  const W=900,H=520,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const rr=(px,py,w,h,r)=>{x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()};
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#FFDAC1');g.addColorStop(.5,'#F8C8DC');g.addColorStop(1,'#C7CEEA');
  x.fillStyle=g;rr(0,0,W,H,40);x.fill();
  [['#B5EAD7',800,70,60],['#FFE6A7',90,450,50],['#BFE3F5',830,440,36],['#FFB7B2',60,80,30]].forEach(([col,cx,cy,r])=>{x.fillStyle=col;x.globalAlpha=.7;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()});
  x.globalAlpha=1;
  x.fillStyle='rgba(255,255,255,.85)';rr(50,130,800,260,32);x.fill();
  x.textAlign='left';x.fillStyle='#5b4b49';x.font='bold 36px sans-serif';x.fillText('🍑 软糯小账本 · 应急恢复救援卡',50,80);
  x.font='56px sans-serif';x.fillText(ACC?ACC.avatar:'🌸',80,215);
  x.font='bold 30px sans-serif';x.fillText(ACC?ACC.name:'',160,200);
  x.font='22px sans-serif';x.fillStyle='#8a7673';x.fillText('账号：'+(ACC?ACC.ident:''),160,235);

async function hashPin(p){
  const s='cozy-salt-'+p;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',u8text(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h;
}

function copyText(text){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);
  return new Promise((res,rej)=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')?res():rej(new Error('复制失败'))}catch(e){rej(e)}ta.remove()});
}
async function copySyncCode(){
  try{
    const code='CREAM2:'+b64(u8text(await encPack(JSON.stringify(snapshot()))));
    await copyText(code);
    toast(`同步码已复制（${(code.length/1024).toFixed(0)}KB）${SY.enc&&ACC?'，已用主密钥加密 🔐':'，未加密，请勿公开分享 ⚠️'}`);
  }catch(e){toast('生成同步码失败：'+e.message)}
}
function pasteSyncModal(){
  openModal('📥 粘贴同步码恢复',`<p class="text-xs sub mb-2">把另一台设备复制的同步码粘贴到这里。恢复会覆盖当前设备的全部数据。若同步码已加密，会要求输入加密它的账户的登录密码。</p><textarea id="sync_in" class="inp" rows="6" placeholder="CREAM2:..." style="font-size:.75rem"></textarea>`,async()=>{
    const code=$('#sync_in').value.trim();
    if(!/^CREAM[12]:/.test(code)){toast('同步码格式不对，应以 CREAM2: 开头');return false}
    try{
      const txt=new TextDecoder().decode(unb64(code.slice(7).replace(/\s+/g,'')));
      const d=JSON.parse(await decPack(txt));
      if(!validData(d)){toast('同步码内容无效');return false}
      if(!confirm(`将用同步码覆盖当前所有数据（含 ${d.txs.length} 笔账单），确定吗？`)){ADOPT=null;return false}
      await applyAdopt();await loadData(d);render();toast('已从同步码恢复 🎉');
    }catch(e){toast('恢复失败：'+e.message);return false}
  },{okText:'恢复数据'});
}

async function gh(path,opt={}){
  if(!SY.token)throw new Error('请先填写 GitHub Token');
  const r=await fetch('https://api.github.com'+path,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+SY.token,'Content-Type':'application/json'}});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(`GitHub ${r.status} ${m}`)}
  return r.json();
}
const GFILE='cream-ledger.json';
async function gistCreate(){
  if(!SY.token){toast('请先填写 GitHub Token（需要 gist 权限）');return}
  try{
    const content=await encPack(JSON.stringify(snapshot()));
    const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Cream Ledger private sync',public:false,files:{[GFILE]:{content}}})});
    SY.gistId=g.id;SY.last=nowStr();await saveSync();render();toast('已创建私密 Gist 并上传 ☁️');
  }catch(e){toast('创建失败：'+e.message)}
}
async function cloudUp(silent){
  if(!SY.token||!SY.gistId){if(!silent)toast('请先填写 Token 和 Gist ID，或点「一键创建」');return}
  if(silent&&SY.enc&&ACC&&!MK)return;
  try{
    const content=await encPack(JSON.stringify(snapshot()));
    await gh('/gists/'+encodeURIComponent(SY.gistId),{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content}}})});
    SY.last=nowStr();saveSync();renderStatus();if(!silent)toast('已上传到云端 ⬆️'+(SY.enc&&ACC?'（已加密）':'（未加密）'));
  }catch(e){if(!silent||!cloudUp.warned){toast('云端同步失败：'+e.message);cloudUp.warned=true}}

async function cloudPull(){
  if(!SY.token||!SY.gistId){toast('请先填写 Token 和 Gist ID');return}

}

  Object.entries(vars).forEach(([a,b])=>rs.setProperty(a,b));
  const ink='color-mix(in srgb,var(--text) 13%,transparent)';
  const bgs={plain:'none',
    grid:`linear-gradient(${ink} 1px,transparent 1px),linear-gradient(90deg,${ink} 1px,transparent 1px)`,
    dot:`radial-gradient(${ink} 1.6px,transparent 1.7px)`,
    lines:`repeating-linear-gradient(transparent,transparent 27px,${ink} 28px)`};
  const sizes={plain:'auto',grid:'24px 24px',dot:'22px 22px',lines:'auto'};
  skinStyle('skinBase').textContent=
   `body{background-image:${bgs[k.paper]||'none'};background-size:${sizes[k.paper]||'auto'}}
    .card:not(#modalBox){border-radius:var(--r)}
    .btn-p,.fab{background:linear-gradient(135deg,var(--pink),color-mix(in srgb,var(--pink) 65%,#fff))}
    .chip.on,.tab.on{background:var(--pink);border-color:var(--pink)}`;
  skinStyle('skinCustom').textContent=k.css||'';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.bg;
}
function setSkin(key,v){
  S.settings.skin={...skin(),[key]:v};
  if(key==='theme')S.settings.dark=(v==='night');
  saveSettings();render();
}
function primaryLive(v){S.settings.skin={...skin(),primary:v};applyTheme()}
function primarySave(){saveSettings();toast('主色调已保存 🎨')}
function cssLive(v){S.settings.skin={...skin(),css:v};applyTheme()}
function cssSave(){saveSettings();toast('自定义样式已保存 ✨')}
function skinReset(){S.settings.skin={...SKIN_DEF};S.settings.dark=false;saveSettings();render();toast('已恢复默认外观')}
function skinCardHtml(){
  const k=skin(),t=THEMES[S.settings.dark?'night':k.theme]||THEMES.peach;
  const chips=(obj,cur,fn)=>Object.entries(obj).map(([id,v])=>`<span class="chip ${cur===id?'on':''}" onclick="${fn}('${id}')">${typeof v==='string'?v:(v.n||v[0])}</span>`).join('');
  return `<div class="card p-4 md:col-span-2"><div class="flex items-center"><b class="mr-auto">🎨 外观与主题工坊</b><button class="btn btn-sm" onclick="skinReset()">↩️ 恢复默认</button></div>
   <div class="text-xs sub mt-2 mb-1">主题皮肤（选「星空黑巧」会同时进入深色模式）</div>
   <div class="flex flex-wrap gap-2">${chips(THEMES,k.theme,"setSkin.bind(null,'theme')")}</div>
   <div class="text-xs sub mt-3 mb-1">手账纸张底纹</div>
   <div class="flex flex-wrap gap-2">${chips(PAPERS,k.paper,"setSkin.bind(null,'paper')")}</div>
   <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
    <div><div class="text-xs sub mb-1">主色调（拖动实时预览）</div>
     <div class="flex items-center gap-2"><input type="color" value="${esc(k.primary||t.p)}" oninput="primaryLive(this.value)" onchange="primarySave()" style="width:3rem;height:2.2rem;border:none;background:none;cursor:pointer" aria-label="主色调">
     <button class="btn btn-sm" onclick="S.settings.skin={...skin(),primary:''};saveSettings();render()">用主题默认色</button></div></div>
    <div><div class="text-xs sub mb-1">卡片圆角</div><div class="flex flex-wrap gap-2">${chips(RADII,k.radius,"setSkin.bind(null,'radius')")}</div></div></div>
   <div class="text-xs sub mt-3 mb-1">✨ 自定义 CSS 美化样式框（粘贴后实时生效，失焦自动保存）</div>
   <textarea class="inp" rows="6" spellcheck="false" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem" placeholder="例如：&#10;.card{box-shadow:0 8px 30px rgba(255,120,150,.25)}&#10;h1{letter-spacing:.15em}" oninput="cssLive(this.value)" onchange="cssSave()">${esc(k.css)}</textarea>
   <p class="text-xs sub mt-1">可用变量:<code>--bg-main</code> <code>--primary</code> <code>--card-bg</code> <code>--text</code> <code>--line</code> <code>--r</code>。样式写坏了页面乱了?点上面「恢复默认」即可清空。</p></div>`;
}

/* ========== 主题 ========== */
function toggleDark(){S.settings.dark=!S.settings.dark;saveSettings();render()}

/* ========== 快捷键 ========== */
document.addEventListener('keydown',e=>{
  if(locked){
    if(LM==='pin'){if(/^\d$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace')pressKey('del')}
    return;
  }
  if(e.key==='Escape'){
    if(zoomOpen()){closeZoom();return}
    if(isModal()){closeModal();return}
  }
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'&&isModal()&&modalSave&&tag!=='button'&&tag!=='textarea'){e.preventDefault();modalOk();return}
  if(['input','textarea','select'].includes(tag)||isModal()||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();txModal()}
  else if(e.key==='l'||e.key==='L'){lockNow()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('row')){e.preventDefault();e.target.click()}
});

/* ========== 启动 ========== */
(async function init(){
  buildLock();
  try{db=await openDB()}catch(e){document.body.innerHTML='<p style="padding:2rem">无法打开浏览器数据库（IndexedDB）。请勿使用无痕模式，并使用 Chrome / Edge / Safari 打开。</p>';return}
  const [accounts,categories,txs,subs,tags,tagGroups,plans,ledgers]=await Promise.all(STORES.map(dbAll));
  S.accounts=accounts;S.categories=categories;S.txs=txs;S.subs=subs;S.tags=tags;S.tagGroups=tagGroups;S.plans=plans;S.ledgers=ledgers;
  const st=await dbGet('kv','settings');S.settings=normSettings(st?st.v:null);
  const sy=await dbGet('kv','sync');
  if(sy){SY={...SY,...sy.v};delete SY.pass}
  if(SY.enc===undefined)SY.enc=true;
  const am=await dbGet('kv','account');ACC=am?am.v:null;
  const ls=await dbGet('kv','lastSaved');if(ls)lastSaved=ls.v;
  const inited=await dbGet('kv','inited');
  if(!inited){
    if(!accounts.length&&!categories.length){
      if(await migrateOld()){normalizeAll();await saveAll();toast('已从旧版数据库迁移 ✨')}
      else await seedDefaults();
    }
    await dbPut('kv',{k:'inited',v:true});
  }
  if(normalizeAll())await saveAll();
  const h=await dbGet('kv','handle');
  if(h&&h.h){fileHandle=h.h;try{fileState=(await fileHandle.queryPermission({mode:'readwrite'}))==='granted'?'ok':'need'}catch(e){fileState='need'}}
  /* 历史栈哨兵：让手机返回手势先被本页消化，不直接退出网页 */
  try{history.replaceState({base:1},'');history.pushState({sent:1},'')}catch(e){}
  if(ACC){if(ACC.protect!==false)showLock()}
  else if(S.settings.pinHash)showLock();
  if(S.settings.autoSub!==false)await runSubs();
  render();
})();
</script>
