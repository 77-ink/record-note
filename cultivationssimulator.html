<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>诸天轮回:脑洞修仙模拟器(豪华完全体)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #171a23;
    --bg3: #1f2330;
    --gold: #d4af37;
    --gold-light: #f5d87a;
    --jade: #5fbf9f;
    --purple: #a855f7;
    --blood: #8b1a1a;
    --ash: #4b4f58;
    --text: #e8e2cf;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "STKaiti", "KaiTi", "Noto Serif SC", "Songti SC", serif;
  }
  body {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(212,175,55,0.08), transparent 55%),
      radial-gradient(ellipse at 90% 100%, rgba(95,191,159,0.07), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }

  /* ===== 古风滚动条 ===== */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0b0d12; border-left: 1px solid #2a2418; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #7a6420, #d4af37, #7a6420);
    border-radius: 6px; border: 2px solid #0b0d12;
  }
  ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #a8892c, #f5d87a, #a8892c); }

  /* ===== 鎏金卡片 ===== */
  .gold-card {
    position: relative;
    background: linear-gradient(145deg, rgba(31,35,48,0.95), rgba(19,22,30,0.97));
    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 12px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6) inset, 0 6px 24px rgba(0,0,0,0.55), 0 0 18px rgba(212,175,55,0.08);
  }
  .gold-card::before, .gold-card::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid var(--gold); pointer-events: none;
  }
  .gold-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
  .gold-card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-bottom-right-radius: 12px; }

  .jade-card {
    background: linear-gradient(145deg, rgba(20,38,34,0.9), rgba(15,22,22,0.95));
    border: 1px solid rgba(95,191,159,0.45);
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5), 0 0 14px rgba(95,191,159,0.1);
  }

  .gold-title {
    background: linear-gradient(90deg, #a8892c, #f5d87a, #d4af37, #f5d87a, #a8892c);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: goldShift 5s linear infinite;
    letter-spacing: 0.12em;
  }
  @keyframes goldShift { to { background-position: 200% center; } }

  /* ===== 按钮 ===== */
  .btn-gold {
    background: linear-gradient(180deg, #3a2f12, #1c160a);
    border: 1px solid var(--gold);
    color: var(--gold-light);
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    transition: all .2s ease; font-family: inherit; letter-spacing: 0.08em;
    box-shadow: 0 0 8px rgba(212,175,55,0.15);
  }
  .btn-gold:hover:not(:disabled) {
    background: linear-gradient(180deg, #5a4818, #2a200c);
    box-shadow: 0 0 16px rgba(245,216,122,0.5); transform: translateY(-1px);
  }
  .btn-gold:active:not(:disabled) { transform: translateY(1px); }
  .btn-gold:disabled { opacity: .4; cursor: not-allowed; filter: grayscale(.6); }
  .btn-jade {
    background: linear-gradient(180deg, #17352c, #0c1c17);
    border: 1px solid var(--jade); color: #b8f0dc;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    transition: all .2s ease; font-family: inherit; letter-spacing: 0.08em;
  }
  .btn-jade:hover:not(:disabled) { box-shadow: 0 0 14px rgba(95,191,159,0.55); transform: translateY(-1px); }
  .btn-jade:disabled { opacity: .4; cursor: not-allowed; }
  .btn-blood {
    background: linear-gradient(180deg, #3a1212, #1a0707);
    border: 1px solid #b33; color: #ffb4b4;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    transition: all .2s ease; font-family: inherit;
  }
  .btn-blood:hover:not(:disabled) { box-shadow: 0 0 14px rgba(200,50,50,0.55); }

  /* ===== 天赋稀有度 ===== */
  /* 彩:天道级 彩色渐变流光边框 */
  .grade-rainbow {
    position: relative; border-radius: 12px; padding: 2px; z-index: 0;
    background: linear-gradient(90deg, #ff0080, #ff8c00, #ffe600, #00ff9d, #00cfff, #7a5cff, #ff0080);
    background-size: 400% 100%;
    animation: rainbowFlow 3s linear infinite;
    box-shadow: 0 0 22px rgba(255,0,128,0.35), 0 0 30px rgba(0,207,255,0.25);
  }
  .grade-rainbow > .inner { background: #12141c; border-radius: 10px; height: 100%; padding: 12px; }
  .grade-rainbow .tname {
    background: linear-gradient(90deg, #ff4d4d, #ffd24d, #4dff88, #4dd2ff, #b84dff, #ff4d4d);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: rainbowFlow 2.5s linear infinite; font-weight: 800;
  }
  @keyframes rainbowFlow { 0% { background-position: 0% 50%; } 100% { background-position: 400% 50%; } }
  .rainbow-text {
    background: linear-gradient(90deg, #ff4d4d, #ffd24d, #4dff88, #4dd2ff, #b84dff, #ff4d4d);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: rainbowFlow 2.5s linear infinite; font-weight: 800;
  }
  .rainbow-border {
    border: 2px solid transparent; border-radius: 10px;
    background: linear-gradient(#12141c,#12141c) padding-box,
      linear-gradient(90deg,#ff0080,#ff8c00,#ffe600,#00ff9d,#00cfff,#7a5cff,#ff0080) border-box;
    background-size: 100% 100%, 400% 100%;
    animation: rainbowFlow 3s linear infinite;
  }

  /* 金:仙品 */
  .grade-gold {
    border: 2px solid #f5c542; border-radius: 12px;
    background: linear-gradient(145deg, rgba(60,46,8,0.85), rgba(22,18,8,0.95));
    box-shadow: 0 0 16px rgba(245,197,66,0.5), inset 0 0 12px rgba(245,197,66,0.15);
    animation: goldPulse 2.4s ease-in-out infinite;
  }
  .grade-gold .tname { color: #ffd84d; text-shadow: 0 0 8px rgba(255,216,77,0.8); font-weight: 800; }
  @keyframes goldPulse {
    0%,100% { box-shadow: 0 0 12px rgba(245,197,66,0.4), inset 0 0 10px rgba(245,197,66,0.12); }
    50% { box-shadow: 0 0 26px rgba(255,220,100,0.75), inset 0 0 16px rgba(245,197,66,0.25); }
  }
  .text-gold-grade { color: #ffd84d; text-shadow: 0 0 6px rgba(255,216,77,0.7); font-weight: 700; }

  /* 紫:奇葩/邪魔 */
  .grade-purple {
    border: 2px solid #a855f7; border-radius: 12px;
    background: linear-gradient(145deg, rgba(44,16,70,0.85), rgba(16,8,26,0.95));
    box-shadow: 0 0 16px rgba(168,85,247,0.5), inset 0 0 12px rgba(168,85,247,0.15);
    animation: purpleWarp 3s ease-in-out infinite;
  }
  .grade-purple .tname { color: #d8a4ff; text-shadow: 0 0 8px rgba(168,85,247,0.9); font-weight: 800; }
  @keyframes purpleWarp {
    0%,100% { box-shadow: 0 0 12px rgba(168,85,247,0.4); filter: hue-rotate(0deg); }
    50% { box-shadow: 0 0 26px rgba(200,100,255,0.75); filter: hue-rotate(-18deg); }
  }
  .text-purple-grade { color: #d8a4ff; text-shadow: 0 0 6px rgba(168,85,247,0.8); font-weight: 700; }

  /* 黑:天谴/负面 */
  .grade-black {
    border: 2px solid #6b1a1a; border-radius: 12px;
    background: linear-gradient(145deg, rgba(40,10,10,0.9), rgba(12,12,14,0.97));
    box-shadow: 0 0 14px rgba(139,26,26,0.5), inset 0 0 14px rgba(0,0,0,0.8);
    animation: curseFlicker 4s steps(1) infinite;
  }
  .grade-black .tname { color: #b05050; text-shadow: 0 0 6px rgba(139,26,26,0.9); font-weight: 800; }
  @keyframes curseFlicker {
    0%,92%,100% { opacity: 1; }
    93% { opacity: .78; } 95% { opacity: 1; } 97% { opacity: .85; }
  }
  .text-black-grade { color: #b05050; font-weight: 700; }

  /* 子嗣灵根/物品品阶辅助色 */
  .tier-common { color: #b5b5b5; }
  .tier-good { color: #7fd6a8; }
  .tier-rare { color: #6fb7ff; }
  .tier-epic { color: #d8a4ff; }
  .tier-legend { color: #ffd84d; text-shadow: 0 0 6px rgba(255,216,77,0.6); }

  /* ===== 进度条 ===== */
  .bar-wrap { background: #0b0d12; border: 1px solid #3a3320; border-radius: 999px; height: 10px; overflow: hidden; }
  .bar-exp { height: 100%; background: linear-gradient(90deg, #7a6420, #f5d87a); transition: width .4s; }
  .bar-hp { height: 100%; background: linear-gradient(90deg, #7a1a1a, #ff5a5a); transition: width .4s; }
  .bar-life { height: 100%; background: linear-gradient(90deg, #1f6b52, #7fffd0); transition: width .4s; }

  /* ===== 日志与动画 ===== */
  .log-line { animation: fadeUp .35s ease both; border-left: 2px solid rgba(212,175,55,0.35); padding-left: 8px; margin: 4px 0; }
  .log-good { border-left-color: #5fbf9f; }
  .log-bad { border-left-color: #b33; color: #e8b0b0; }
  .log-rare { border-left-color: #f5d87a; color: #ffe9a0; }
  .log-epic { border-left-color: #a855f7; color: #e2c4ff; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .pop-in { animation: popIn .35s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes popIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-6px);} 75% { transform: translateX(6px);} }
  .float-glow { animation: floatGlow 4s ease-in-out infinite; }
  @keyframes floatGlow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .modal-mask { position: fixed; inset: 0; background: rgba(5,6,9,0.82); backdrop-filter: blur(3px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .divider-gold { height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); border: 0; margin: 10px 0; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid rgba(212,175,55,0.5); color: var(--gold-light); margin: 2px 3px 2px 0; }
  .tag-jade { border-color: rgba(95,191,159,0.6); color: #b8f0dc; }
  .tag-red { border-color: rgba(200,60,60,0.6); color: #ffb4b4; }
  .tag-purple { border-color: rgba(168,85,247,0.6); color: #e2c4ff; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ============================================================
   数据约定(第二、三部分将按此约定读取):
   四维属性 stats: body 体魄 / wit 悟性 / luck 气运 / charm 魅力
   效果对象 fx 可用字段:
     exp 修为(±)  stone 灵石(±)  life 寿元(±年)  hp 气血上限(±)
     body/wit/luck/charm 四维(±)
     favor 目标NPC好感(±)  item 获得物品id  items 获得多个物品id数组
     enemy {name, power} 新增仇人   child true 触发生子判定
     adopt true 触发认义父   die true 当场陨落   breakthrough true 免费冲关一次
     power 战力永久(±%)   tag 文本标记
   ============================================================ */

/* ============================ 一、境界库 REALMS ============================
   need:升至下一层所需修为   life:突破到该层获得的寿元加成(年)
   mul:战力倍率   rate:突破基础成功率(0-1)   */
const REALMS = [
  { id: 0,  name: "炼气一层", tier: "炼气", need: 100,        life: 0,    mul: 1,      rate: 0.95, flavor: "引气入体,你终于不是凡人了。村口二狗子看你的眼神从嫌弃变成了羡慕。" },
  { id: 1,  name: "炼气二层", tier: "炼气", need: 220,        life: 3,    mul: 1.4,    rate: 0.93, flavor: "丹田里多了一缕气,像刚煮开的泡面香气,隐隐约约。" },
  { id: 2,  name: "炼气三层", tier: "炼气", need: 420,        life: 3,    mul: 1.9,    rate: 0.92, flavor: "你已能徒手劈开一块西瓜,这在凡人界已是武林宗师。" },
  { id: 3,  name: "炼气四层", tier: "炼气", need: 700,        life: 4,    mul: 2.5,    rate: 0.90, flavor: "灵气入体如饮冰水,通透舒爽,只是肾有点虚。" },
  { id: 4,  name: "炼气五层", tier: "炼气", need: 1100,       life: 4,    mul: 3.2,    rate: 0.88, flavor: "宗门执事开始记得你的名字了,虽然念错了一个字。" },
  { id: 5,  name: "炼气六层", tier: "炼气", need: 1700,       life: 5,    mul: 4.1,    rate: 0.86, flavor: "你学会了御物术,第一件御起来的东西是一双臭袜子。" },
  { id: 6,  name: "炼气七层", tier: "炼气", need: 2500,       life: 5,    mul: 5.2,    rate: 0.84, flavor: "同期弟子开始喊你师兄,你开始习惯了背手望天。" },
  { id: 7,  name: "炼气八层", tier: "炼气", need: 3600,       life: 6,    mul: 6.6,    rate: 0.82, flavor: "气海翻涌,一口浊气吐出,三步外的蚊子当场驾鹤西去。" },
  { id: 8,  name: "炼气九层", tier: "炼气", need: 5200,       life: 8,    mul: 8.5,    rate: 0.80, flavor: "炼气圆满!距离筑基只差一个机缘,和一个不会被雷劈的运气。" },
  { id: 9,  name: "筑基期",   tier: "筑基", need: 12000,      life: 80,   mul: 20,     rate: 0.65, flavor: "筑基成功,脱胎换骨!寿元大增,从此可以名正言顺地自称“道友”,不再被叫“小友”。" },
  { id: 10, name: "金丹期",   tier: "金丹", need: 60000,      life: 200,  mul: 70,     rate: 0.55, flavor: "丹田之中金丹旋转,九天雷劫都得夸你一句“丹圆如月”。你在宗门有了自己的洞府,和一条看门灵犬。" },
  { id: 11, name: "元婴期",   tier: "元婴", need: 300000,     life: 500,  mul: 280,    rate: 0.45, flavor: "元婴出窍,神游万里。你的小人儿会抱着你的大腿喊爹,这设定确实有点诡异。" },
  { id: 12, name: "化神期",   tier: "化神", need: 1500000,    life: 1000, mul: 1200,   rate: 0.38, flavor: "化神!一念山河动,一语风云变。你随口一句“尔等蝼蚁”,三千里外的妖王吓得尿了裤子。" },
  { id: 13, name: "炼虚期",   tier: "炼虚", need: 8000000,    life: 2000, mul: 6000,   rate: 0.30, flavor: "炼虚合道,虚空为室。你终于能在虚空里面开个小号了,顺便挖了个洞府。" },
  { id: 14, name: "合体期",   tier: "合体", need: 40000000,   life: 4000, mul: 30000,  rate: 0.25, flavor: "元神与肉身合二为一,天地同频。你打了个喷嚏,隔壁大陆下了三天三夜的雨。" },
  { id: 15, name: "大乘期",   tier: "大乘", need: 200000000,  life: 8000, mul: 150000, rate: 0.18, flavor: "大乘圆满,半步仙人。整个修仙界都在传颂你的名号,连青楼的小曲都给你编了十八段。" },
  { id: 16, name: "渡劫飞升", tier: "飞升", need: 500000000,   life: 20000,mul: 1000000,rate: 0.10, flavor: "九九天劫,雷罚加身。熬过去,你便是真仙;熬不过,下辈子投个好胎。诸天万界,等你来战!" }
];

/* ============================ 二、天赋库 TALENTS ============================
   grade: 彩(天道级) 金(仙品) 紫(奇葩/邪魔) 黑(天谴/负面)
   effectType 约定(第二部分在对应处理函数中实现):
     lickdog_return / multi_child / moon_buff / blood_cow / adopt_father / reject_stronger /
     lone_star / ... 详见各条 desc 与 params */
const TALENTS = [
  /* ---------------- 彩:天道级 ---------------- */
  { id: "T_LICKDOG", name: "舔狗万倍返还", grade: "彩", effectType: "lickdog_return",
    desc: "你给异性NPC赠礼时,100%触发“舔到最后一无所有,却能得到一切”的万倍暴击返还:百倍至万倍的高阶仙丹、海量灵石或神级功法残卷从天而降。女神说你是好人,系统说你是爹。",
    params: { minMul: 100, maxMul: 10000, chance: 1.0 } },
  { id: "T_MULTICHILD", name: "多子多福", grade: "彩", effectType: "multi_child",
    desc: "每次与道侣生子成功,天道降下功德金光:无视瓶颈直接暴涨修为,全属性按百分比永久提升,寿元再+50年。真正的修仙界劳模,生育即修炼,造人即造化!",
    params: { expPct: 0.25, statPct: 0.05, life: 50 } },
  { id: "T_MOONGOD", name: "月抛型概念神", grade: "彩", effectType: "moon_buff",
    desc: "每过1年(或每3次行动),自动随机切换一个超模BUFF:攻击×999、突破率100%、必捡仙器、灵石翻倍、百毒不侵……你就像月抛隐形眼镜,每个月都是全新的神,只是不保证上个月的你是不是欠了债。",
    params: { everyActions: 3, buffs: ["atk999", "break100", "must_treasure", "stone_x10", "immune_all", "exp_x5", "charm_max"] } },
  { id: "T_FATESON", name: "天命主角光环", grade: "彩", effectType: "protagonist",
    desc: "你就是这本书的主角!每次濒死必然触发“危急关头爷爷附体/神秘戒指苏醒/路边老乞丐是大佬”三选一的奇遇,且死前必有人替你挡刀。作者亲儿子,谁来都得让道。",
    params: { reviveChance: 1.0, perLifeTimes: 3 } },
  { id: "T_SYSTEM", name: "签到系统(氪金版)", grade: "彩", effectType: "sign_in",
    desc: "叮!宿主每次行动都自动签到,必得灵石、修为或随机神器。连续签到7次触发“七日大礼包”:一件仙器+一本功法。系统还会在你装逼之前贴心地提醒:“宿主,该打脸了。”",
    params: { stoneBase: 200, streakReward: 7 } },
  { id: "T_ALLDAO", name: "诸天万道亲和", grade: "彩", effectType: "all_dao",
    desc: "你对所有大道的亲和度拉满:修炼收益×3,破境成功率+30%,看别人打架就能偷学招式。天道看了你的灵根报告,默默把自己的名字改成了“某某的小弟”。",
    params: { expMul: 3, breakBonus: 0.3 } },

  /* ---------------- 金:仙品 ---------------- */
  { id: "T_BLOODCOW", name: "十里坡血牛", grade: "金", effectType: "blood_cow",
    desc: "你的血池是个无底洞。每次点击任何行动,气血上限无脑+10000;战斗时附带自身气血上限20%的真实反伤。别人砍你一刀,他的刀先崩了;别人砍你十刀,他的肾先崩了。",

/* ---------------- 基础工具 ---------------- */
const rnd = (a, b) => Math.random() * (b - a) + a;

  wf = wf || (x => x.w);
  const tot = list.reduce((s, x) => s + wf(x), 0);
  let r = Math.random() * tot;
  for (const x of list) { r -= wf(x); if (r <= 0) return x; }
  return list[list.length - 1];
}

function rollPool(exclude) {
  const out = [];
  const ids = new Set(exclude || []);
  while (out.length < 10) {
    const grade = wpick([{ g: "彩", w: 7 }, { g: "金", w: 25 }, { g: "紫", w: 33 }, { g: "黑", w: 35 }]).g;
    const cands = TALENTS.filter(t => t.grade === grade && !ids.has(t.id));
    if (!cands.length) continue;
    const t = pick(cands);
    ids.add(t.id);
    out.push(t.id);
  }
  return out;
}

function loadSave(key) {

    if (!g || g.v !== SAVE_VER || !g.phase) return null;
    g.auto = false;
    if ((g.phase === "play" || g.phase === "end") && (typeof g.exp !== "number" || !isFinite(g.exp))) {

function addLog(g, t, k) {

const trig = (g, id, n) => { g.tstat[id] = (g.tstat[id] || 0) + (n || 1); };

function hpMaxOf(g) {
  const base = (100 + g.stats.body * 25) * (1 + g.realm * 0.6);
  return Math.floor(base * (hasT(g, "T_WEAKBODY") ? 0.7 : 1)) + g.hpBonus;
}
const expNeed = g => (g.realm >= 16 ? ASCEND_NEED : REALMS[g.realm].need);
function successBonus(g) {
  return (hasT(g, "T_LUCKY") ? 0.25 : 0) - (hasT(g, "T_UNLUCKY") ? 0.2 : 0)
    + g.stats.luck / 400 + (g.buff === "must_treasure" ? 0.1 : 0);
}
function calcPower(g) {
  const s = g.stats;
  const base = 30 + s.body * 4 + s.wit * 2 + s.luck + s.charm;
  let m = 1 + g.powerBonus;
  if (hasT(g, "T_HAREM")) m += g.wives.length * 0.08;
  let p = base * REALMS[g.realm].mul * m;
  if (g.drunk > 0 && hasT(g, "T_ALCOHOL")) p *= 3;
  if (g.ntr > 0) p *= 5;
  if (g.buff === "atk999") p *= 999;
  return Math.floor(p);
}

  if (hasT(g, "T_SWORDBONE") && eP <= pP * 30) p += (1 - p) * 0.4;

  addLog(g, "「" + n.name + "」被别人抢走了!心境崩塌,修为-" + fmt(loss) + "。但悲愤出强者:5年内修为收益×1.5。", "bad");
  if (hasT(g, "T_NTR")) {
    g.ntr = 10; trig(g, "T_NTR");
    addLog(g, "【牛头人克星】觉醒绿帽神功!战力×5,持续10年!", "epic");

function ntrCheck(g, id) {
  if (!hasT(g, "T_NTRTARGET") || !chance(0.3)) return false;

function nearbyPeople(g) {
  return NPCS.map(n => ({ n: n, s: g.npc[n.id] }))
    .filter(x => x.s.alive && !x.s.stolen && x.s.favor > 0)
    .sort((a, b) => b.s.favor - a.s.favor);
}
function guessNpc(g, ev) {
  const txt = (ev.title || "") + (ev.text || "");
  const alive = n => g.npc[n.id].alive && !g.npc[n.id].stolen;
  let hit = NPCS.find(n => alive(n) && (txt.includes(n.name) || txt.includes(n.title)));
  if (!hit) {
    const pool = NPCS.filter(n => n.id !== "N13" && alive(n));
    hit = pool.length ? pick(pool) : NPCS[0];
  }
  return hit.id;
}

/* ---------------- 子嗣 ---------------- */
function rollRoot(g) {
  let r = wpick(CHILD_ROOTS, x => x.weight);
  if (g.childBoost > 0) {
    const idx = Math.min(CHILD_ROOTS.length - 1, CHILD_ROOTS.indexOf(r) + 1);
    r = CHILD_ROOTS[idx];
    g.childBoost--;
  }
  return r;
}
function bearChild(g, npcId) {
  const root = rollRoot(g);

  const sex = chance(0.5) ? "子" : "女";
  const kid = {
    id: "c" + Date.now() + rint(10, 99), name: (g.name ? g.name.charAt(0) : "叶") + pick(CHILD_GIVEN),
    root: root.id, bornAge: g.age, age: 0, adult: false, mother: npcId, motherName: mother.name, sex: sex
  };
  g.children.push(kid);
  const w = g.wives.find(x => x.id === npcId);
  if (w) w.kids = (w.kids || 0) + 1;
  g.npc[npcId].lastBaby = g.age;
  addLog(g, mother.name + "诞下一" + (sex === "女" ? "女" : "子") + "「" + kid.name + "」,灵根:" + root.name + "。" + root.desc,
    root.feedMul >= 60 ? "epic" : root.feedMul >= 8 ? "rare" : "good");
  // 出生奖励
  const need = REALMS[Math.min(g.realm, 15)].need;
  const birth = gainExp(g, Math.min(need * 2, need * 0.005 * root.feedMul));
  if (root.feedMul >= 100) {
    g.broadcast = { kind: "child", title: "天降异象·" + root.name, lines: [kid.name + "降生!", root.desc, "出生反哺修为 +" + fmt(birth)] };
  }
  if (hasT(g, "T_MULTICHILD")) {
    trig(g, "T_MULTICHILD");
    const gain = gainExp(g, need * 0.6);           // 无视瓶颈:直接涨修为,不受上限
    STAT_KEYS.forEach(k => { g.stats[k] = Math.ceil(g.stats[k] * 1.2); }); // 全属性 +20%
    g.lifeMax += 50;
    g.powerBonus += 0.03;
    g.breakBonus += 0.15;
    addLog(g, "【多子多福】天降功德金光!修为+" + fmt(gain) + ",全属性+20%,寿元+50年,战力永久+3%,下次突破成功率+15%!", "epic");
  }
  return kid;
}

/* ---------------- 效果结算(事件与物品通用) ---------------- */
function realmUp(g) {
  if (g.realm >= 16) return false;
  const nx = g.realm + 1;
  const life = Math.floor(REALMS[nx].life * (hasT(g, "T_LONGLIFE") ? 1.3 : 1));
  g.realm = nx;
  g.lifeMax += life;
  g.stats.body += 1 + Math.floor(nx / 3);
  g.stats.wit += 1 + Math.floor(nx / 5);
  g.stats.luck += nx % 2;
  g.hpMax = hpMaxOf(g);
  g.hp = g.hpMax;
  addLog(g, "【突破】" + REALMS[nx].name + "!寿元+" + life + "年,体魄悟性提升。" + REALMS[nx].flavor, "epic");
  return true;
}
function applyFx(g, fx, ctx) {
  ctx = ctx || {};
  const gains = [];
  if (!fx) return gains;
  const sign = v => (v >= 0 ? "+" : "") + v;
  if (fx.exp) { const v = gainExp(g, fx.exp); gains.push("修为" + (v >= 0 ? "+" : "") + fmt(v)); }
  if (fx.stone) { const v = addStone(g, fx.stone); gains.push("灵石" + (v >= 0 ? "+" : "") + fmt(v)); }
  if (fx.life) { g.lifeMax += fx.life; gains.push("寿元" + sign(fx.life) + "年"); }
  if (fx.hp) {
    if (fx.hp >= 10000) { g.hpBonus += fx.hp; g.hp += fx.hp; gains.push("气血上限+" + fmt(fx.hp)); }   // ≥10000 视为永久上限
    else if (fx.hp > 0) { g.hp = Math.min(hpMaxOf(g), g.hp + hpMaxOf(g) * fx.hp / 1000); gains.push("气血回复" + (fx.hp / 10) + "%"); }
    else { const d = hurt(g, -fx.hp / 1000, true); gains.push(d ? "受伤-" + fmt(d) + "气血" : "免疫伤害"); }
  }
  STAT_KEYS.forEach(k => {
    if (fx[k]) { g.stats[k] = Math.max(1, g.stats[k] + fx[k]); gains.push(STAT_NAMES[k] + sign(fx[k])); }
  });
  if (fx.favor && ctx.npcId) {
    const v = fx.favor > 0 && g.buff === "charm_max" ? fx.favor * 2 : fx.favor;
    setFavor(g, ctx.npcId, v);
    gains.push(NPC_BY_ID[ctx.npcId].name + "好感" + sign(v));
  }
  if (fx.item) { addItem(g, fx.item); gains.push("获得「" + ITEM_BY_ID[fx.item].name + "」"); }
  if (fx.items) fx.items.forEach(i => { addItem(g, i); gains.push("获得「" + ITEM_BY_ID[i].name + "」"); });
  if (fx.power) { g.powerBonus += fx.power; gains.push("战力永久" + (fx.power > 0 ? "+" : "") + Math.round(fx.power * 100) + "%"); }
  if (fx.adopt) {
    const f = { name: ctx.title ? ctx.title + "的义父" : "义父", deathAge: g.age + 3, enemy: fx.enemy || null };
    g.fathers.push(f);
    trig(g, "T_FATHER");
    gains.push("认了义父(3年内必暴毙)");
  } else if (fx.enemy) {
    addEnemy(g, fx.enemy);
    gains.push("仇人录+「" + fx.enemy.name + "」");
  }
  if (fx.child && ctx.npcId) {
    addWife(g, ctx.npcId, true);
    bearChild(g, ctx.npcId);
    gains.push("喜得贵子");
  }
  if (fx.breakthrough) { if (realmUp(g)) gains.push("境界突破至" + REALMS[g.realm].name); }
  if (fx.die) g.dying = ctx.dieText || "陨落";
  return gains;
}
function applyItem(g, item, opts) {
  opts = opts || {};
  const u = item.use || {};
  const gains = [];
  let mul = 1;
  if (item.type === "丹药") {
    if (hasT(g, "T_ALCHEMY")) { mul *= 2; trig(g, "T_ALCHEMY"); }
    if (hasT(g, "T_PILLGOD")) { mul *= 2; trig(g, "T_PILLGOD"); }
  }
  const sword = item.type === "兵器" && hasT(g, "T_SWORDBONE");
  if (u.exp) gains.push("修为+" + fmt(gainExp(g, u.exp * mul)));
  if (u.hp) { g.hp = Math.min(hpMaxOf(g), g.hp + hpMaxOf(g) * u.hp * mul / 1000); gains.push("气血回复"); }
  if (u.life) { g.lifeMax += u.life * mul; gains.push("寿元+" + u.life * mul + "年"); }
  STAT_KEYS.forEach(k => { if (u[k]) { g.stats[k] += Math.round(u[k] * mul); gains.push(STAT_NAMES[k] + "+" + Math.round(u[k] * mul)); } });
  if (u.stone) gains.push("灵石+" + fmt(addStone(g, u.stone)));
  if (u.power) { g.powerBonus += u.power * (sword ? 3 : 1); gains.push("战力永久+" + Math.round(u.power * (sword ? 3 : 1) * 100) + "%"); if (sword) trig(g, "T_SWORDBONE"); }
  if (u.breakBonus) { g.breakBonus += u.breakBonus; gains.push("下次突破成功率+" + Math.round(u.breakBonus * 100) + "%"); }
  if (u.shield) { g.shield += u.shield; gains.push("护身符×" + u.shield); }
  if (u.child) { g.guaranteeChild = true; g.childBoost += (u.childBoost || 0); gains.push("道侣下次必定受孕,灵根提升一档"); }
  if (u.favor) {
    let tid = opts.npcId;
    if (!tid) { const c = nearbyPeople(g)[0]; tid = c ? c.n.id : "N01"; }
    setFavor(g, tid, u.favor);
    gains.push(NPC_BY_ID[tid].name + "好感+" + u.favor);
    if (u.risk && chance(u.risk)) {
      const n = NPC_BY_ID[tid];
      hurt(g, 0.3, true);
      addEnemy(g, { name: n.name, power: n.realm });
      addLog(g, "合欢散的“清算”来了:" + n.name + "醒来后拔剑相向,你被砍了一剑,她记进了仇人录。", "bad");
    }
  }
  if (u.removeEnemy) {
    const idx = opts.enemyIdx || 0;
    const e = g.enemies[idx];
    if (e) { g.enemies.splice(idx, 1); gains.push("划去仇人「" + e.name + "」"); } else gains.push("仇人录是空的,符纸白烧了");
  }
  if (u.adopt && u.risk) {
    if (chance(1 - u.risk) || chance(clamp(successBonus(g), 0, 0.3))) {
      const e = gainExp(g, REALMS[g.realm].need * 1.5);
      g.lifeMax += 80;
      gains.push("夺舍成功:修为+" + fmt(e) + ",寿元+80年");
    } else { g.dying = "夺舍失败,魂飞魄散"; gains.push("夺舍失败"); }
  }
  if (item.id === "P12") gains.push("储物戒认主,能装更多垃圾了");
  if (item.id === "P10" && chance(0.05)) gains.push("你喝成了“茶醉”,睡了三天");
  if (item.type === "丹药" && hasT(g, "T_ALCHEMY") && chance(0.1)) {
    addItem(g, "P02"); gains.push("丹成异象!额外得到「培元丹」");
  }
  return gains;
}

/* ---------------- 战斗相关 ---------------- */
function ambush(g, e) {

  if (hasT(g, "T_HARDEMPEROR") && !chance(winRate(g, e))) {
    trig(g, "T_HARDEMPEROR");
    const steal = Math.floor(e.stone * 0.2);
    addStone(g, steal);
    addLog(g, "【老阴比】你笑着拱手“有话好说”,下一秒撤退无损,顺手摸走灵石" + fmt(steal) + "。", "rare");
    return;
  }
  if (chance(winRate(g, e))) {
    const loot = addStone(g, Math.floor(e.stone * (hasT(g, "T_ROBBER") ? 3 : 1) * 0.5));
    const ex = gainExp(g, Math.floor(e.exp * 0.1));
    g.enemies = g.enemies.filter(x => x.id !== e.id);
    g.kills++;
    if (hasT(g, "T_BLOODCOW")) { trig(g, "T_BLOODCOW"); addLog(g, "【十里坡血牛】真实反伤触发,对方一刀砍下去,刀先崩了。", "rare"); }
    addLog(g, "你反手镇压了「" + e.name + "」,缴获灵石" + fmt(loot) + ",修为+" + fmt(ex) + "。", "good");
  } else {
    const d = hurt(g, rnd(0.25, 0.5), false, true);
    const lost = Math.floor(g.stone * 0.15);
    g.stone -= lost;
    addLog(g, "你不敌「" + e.name + "」,气血-" + fmt(d) + ",灵石被抢走" + fmt(lost) + "。", "bad");

}

/* ---------------- 每次行动 / 每年被动 ---------------- */
function rollMoon(g) {
  const keys = Object.keys(MOON_BUFFS).filter(k => k !== g.buff);
  g.buff = pick(keys);
  trig(g, "T_MOONGOD");
  addLog(g, "【月抛型概念神】新一期外挂上线:" + MOON_BUFFS[g.buff].name + "!(" + MOON_BUFFS[g.buff].desc + ")", "epic");
  if (g.buff === "must_treasure") {
    const it = pick(["P07", "P11"]);
    addItem(g, it);
    addLog(g, "必捡仙器生效,你随手捡到「" + ITEM_BY_ID[it].name + "」。", "rare");
  }
}
function perAction(g) {
  if (hasT(g, "T_BLOODCOW")) {
    g.hpBonus += 10000; g.hp += 10000; trig(g, "T_BLOODCOW");
    if (g.actions % 3 === 0) addLog(g, "【十里坡血牛】气血上限无脑+10000!当前血池 " + fmt(hpMaxOf(g)) + "。", "rare");
  }
  if (hasT(g, "T_SYSTEM")) {
    g.streak++; trig(g, "T_SYSTEM");
    const st = addStone(g, 200 * (g.realm + 1));
    if (g.streak % 7 === 0) {
      addItem(g, "P07"); addItem(g, "P19");
      addLog(g, "叮!连续签到" + g.streak + "天,【七日大礼包】:仙器「诛仙剑」+功法「玉女心经」!系统:宿主,该打脸了。", "epic");
    } else {
      addLog(g, "叮!签到成功,灵石+" + fmt(st) + "(连续" + g.streak + "天)。", "good");
    }
  }
  if (hasT(g, "T_MOONGOD") && g.actions % 3 === 0) rollMoon(g);
  if (g.drunk > 0) g.drunk--;
}
function yearly(g) {
  const hpMax = hpMaxOf(g);
  g.hp = Math.min(hpMax, g.hp + hpMax * 0.2);
  if (g.ntr > 0) g.ntr--;
  if (g.grief > 0) g.grief--;

  // 子嗣成长与反哺
  let feed = 0;
  g.children.forEach(c => {
    c.age = Math.floor(g.age - c.bornAge);
    const r = ROOT_BY_ID[c.root];
    if (!c.adult && c.age >= 16) {
      c.adult = true;
      const add = Math.max(1, Math.ceil(r.statBonus / 4));
      STAT_KEYS.forEach(k => { g.stats[k] += add; });
      addLog(g, "子嗣「" + c.name + "」(" + r.name + ")成年了,你全属性+" + add + "。孩子说:“爹,我要下山了。”", "rare");
    }
    if (c.adult) {
      const need = REALMS[Math.min(g.realm, 15)].need;
      feed += Math.min(need * 2, need * 0.01 * r.feedMul);
    }
  });
  if (feed > 0) {
    const v = gainExp(g, feed);
    g.feedTotal += v;
    addLog(g, "子嗣孝敬反哺,修为+" + fmt(v) + "。", "good");
  }

  // 义父暴毙
  g.fathers = g.fathers.filter(f => {
    if (g.age >= f.deathAge) {
      addLog(g, "义父「" + f.name + "」果然暴毙了,临终前死死盯着你:“孩子……你好狠……”", "bad");
      addEnemy(g, f.enemy || { name: f.name + "的旧部", power: Math.min(16, g.realm + 2) });
      return false;
    }
    return true;
  });

  // 天煞孤星
  if (hasT(g, "T_LONESTAR") && chance(0.12)) {
    const top = nearbyPeople(g)[0];
    if (top) {
      trig(g, "T_LONESTAR");
      const ex = gainExp(g, REALMS[top.n.realm].need);
      const st = addStone(g, 500 * Math.pow(top.n.realm + 1, 2));
      killNpc(g, top.n.id);
      addLog(g, "【天煞孤星】「" + top.n.name + "」今年暴毙了……你继承其修为" + fmt(ex) + "与遗产灵石" + fmt(st) + "。你擦了擦眼泪:“这是命。”", "epic");
    }
  }
  // 魔心种子
  if (hasT(g, "T_DEMONHEART")) {
    const add = Math.floor(g.exp * 0.1);
    g.exp += add; g.seedTimer++; trig(g, "T_DEMONHEART");
    if (g.seedTimer >= 10) {
      g.seedTimer = 0;
      const top = nearbyPeople(g)[0];
      if (top) {
        killNpc(g, top.n.id);
        addLog(g, "【魔心种子】十年之期已至,魔种吞噬了你最亲近的人「" + top.n.name + "」。修为得以保全。", "bad");
      } else { g.exp = 0; addLog(g, "【魔心种子】无人可献祭,修为被魔种吸干清零!", "bad"); }
    }
  }
  // 穷鬼转世
  if (hasT(g, "T_POOR")) {
    const l = Math.floor(g.stone * 0.1);
    g.stone -= l;
    if (l > 0) addLog(g, "【穷鬼转世】月圆之夜," + fmt(l) + "灵石莫名消失了。", "bad");
  }
  // 丹药当饭吃
  if (hasT(g, "T_PILLGOD")) {
    let need = 10;
    Object.keys(g.bag).forEach(id => {
      const it = ITEM_BY_ID[id];
      while (need > 0 && g.bag[id] > 0 && it && it.type === "丹药") {
        takeItem(g, id); applyItem(g, it); need--;
      }
    });
    if (need > 0) {
      const d = hurt(g, 0.25, true);
      g.exp = Math.floor(g.exp * 0.97);
      addLog(g, "【丹药当饭吃】今年少吃了" + need + "颗丹药,体内丹毒暴走:气血-" + fmt(d) + ",修为-3%。", "bad");
    } else addLog(g, "【丹药当饭吃】今年的十颗丹药按时下肚,药力翻倍生效。", "good");
  }
  // 背刺体质
  if (hasT(g, "T_BETRAY") && chance(0.1)) {
    trig(g, "T_BETRAY");
    const keys = Object.keys(g.bag).filter(k => g.bag[k] > 0);
    let what;
    if (keys.length) { const k = pick(keys); takeItem(g, k); what = ITEM_BY_ID[k].name; }
    else { const l = Math.floor(g.stone * 0.3); g.stone -= l; what = fmt(l) + "灵石"; }
    if (g.wives.length) {
      const w = pick(g.wives);
      removeWife(g, w.id);
      addEnemy(g, { name: w.name, power: NPC_BY_ID[w.id].realm });
      addLog(g, "【背刺体质】道侣「" + w.name + "」在你背后捅了一刀,带走了" + what + ",还进了你的仇人录。", "bad");
    } else addLog(g, "【背刺体质】多年好友在你背后捅了一刀,带走了" + what + "。", "bad");
  }
  // 道侣被抢(任何人都有 1.5% 概率)
  if (g.wives.length && chance(0.015)) stealWife(g, pick(g.wives).id);
  // 仇家上门
  if (g.enemies.length) {
    if (g.hunted && chance(0.4)) {
      const e = makeEnemy("正道围剿者", Math.min(16, g.realm + 1));
      addLog(g, "你已被全修仙界通缉(心魔满10)!", "bad");
      ambush(g, e);
    } else {
      const threats = g.enemies.filter(e => e.power <= g.realm + 3);
      if (threats.length && chance(0.1)) ambush(g, pick(threats));
    }
  }
}
function advance(g, years) {
  const before = Math.floor(g.age);
  g.age = Math.round((g.age + years) * 100) / 100;
  g.actions++;
  perAction(g);
  const after = Math.floor(g.age);
  for (let y = before; y < after; y++) { yearly(g); if (g.dying) break; }
}

/* ---------------- 事件辅助 ---------------- */
function visibleChoices(ev, g) {

  }
}

/* ---------------- 开局初始化 ---------------- */
function startWorld(g) {
  const idn = IDN_BY_ID[g.identityId];
  const p = blankPlay();
  const keep = { phase: "play", meta: g.meta, v: SAVE_VER, draw: g.draw, talents: g.draw.picks.slice(), name: g.name, identityId: g.identityId };
  Object.keys(g).forEach(k => delete g[k]);
  Object.assign(g, p, keep);
  g.age = START_AGE[idn.id] || 16;
  g.lifeMax = g.age + idn.life + (hasT(g, "T_LONGLIFE") ? 100 : 0) + (hasT(g, "T_SHORTLIFE") ? -30 : 0);
  g.lifeMax = Math.max(g.lifeMax, g.age + 2);
  g.stats = { body: idn.stats.body, wit: idn.stats.wit, luck: idn.stats.luck, charm: idn.stats.charm };
  if (hasT(g, "T_BEAUTY")) g.stats.charm += 50;
  if (hasT(g, "T_WEAKBODY")) g.stats.wit += 30;
  g.stone = idn.stone;
  g.exp = idn.exp;
  g.realm = INIT_REALM[idn.id] || 0;
  NPCS.forEach(n => {
    let f = n.favor + (hasT(g, "T_BEAUTY") ? 30 : 0) + (hasT(g, "T_SHORTLIFE") ? 20 : 0);
    g.npc[n.id] = { favor: clamp(f, -100, 100), alive: true, stolen: false, lastBaby: -99 };
  });
  g.hpMax = hpMaxOf(g);
  g.hp = g.hpMax;
  g.reviveLeft = { protag: hasT(g, "T_FATEON") ? 3 : 3, unlucky: 1 };
  addLog(g, "【穿越】" + g.name + ",你成为了「" + idn.name + "」。", "epic");
  addLog(g, idn.intro, "info");
  if (idn.bound.type === "spouse") {
    g.npc[idn.bound.npc].favor = Math.max(g.npc[idn.bound.npc].favor, 60);
    addWife(g, idn.bound.npc, true);
  } else if (idn.bound.type === "enemy") {
    const n = NPC_BY_ID[idn.bound.npc];
    g.npc[n.id].favor = Math.min(g.npc[n.id].favor, -30);
    addEnemy(g, { name: n.name, power: n.realm });
    addLog(g, "仇人录自动记下:「" + n.name + "」。", "bad");
  } else if (idn.bound.type === "master") {
    g.master = idn.bound.npc;
    setFavor(g, idn.bound.npc, 40);
    addLog(g, "你与「" + NPC_BY_ID[idn.bound.npc].name + "」有一段师徒/宿主缘分,好感+40。", "rare");
  }
  g.talents.forEach(id => {
    const t = T_BY_ID[id];
    addLog(g, "携带天赋【" + t.name + "】(" + t.grade + "):" + t.desc, t.grade === "彩" ? "epic" : t.grade === "金" ? "rare" : t.grade === "紫" ? "epic" : "bad");
  });
  if (hasT(g, "T_MOONGOD")) rollMoon(g);
}

/* ---------------- 死亡 / 飞升 / 轮回结算 ---------------- */
function buildResult(g, cause, ascended) {
  const idn = IDN_BY_ID[g.identityId];
  const realmName = REALMS[g.realm].name;
  const kids = g.children.length, wives = g.wives.length;
  const score = g.realm * 800 + kids * 150 + wives * 100 + Math.floor(Math.log10(g.exp + 1)) * 100 + g.kills * 30 + (ascended ? 10000 : 0);
  let title;
  if (ascended && kids >= 5) title = "多子多福·飞升界计生办劳模";
  else if (ascended && g.talents.some(t => T_BY_ID[t].grade === "彩")) title = "天道亲儿子·诸天万界第一卷王";
  else if (ascended) title = "渡劫飞升·终成真仙";
  else if (g.demon >= 10) title = "吞天魔头·修仙界食堂大妈";
  else if (g.tstat.T_LONESTAR >= 2) title = "孤星独照·朋友圈清零大师";
  else if (kids >= 8) title = "人形种马·修仙界人口普查员";
  else if (wives >= 5) title = "后宫之主·被捅之王";
  else if (g.realm >= 12) title = "一代宗师·昙花一现";
  else if (g.realm >= 9) title = "金丹老登·死得其所";
  else if (g.realm >= 3) title = "炼气期卷王·出师未捷身先死";
  else title = "新手村摆烂王·开局即巅峰";
  const talents = g.talents.map(id => "【" + T_BY_ID[id].name + "】").join("");
  const epitaph = [
    "此处长眠:" + g.name + "(原「" + idn.name + "」)",
    "享年" + Math.floor(g.age) + "岁,终境界:" + realmName,
    cause + "。",
    "生前携天赋" + talents + ",得道侣" + wives + "人,育子嗣" + kids + "人,镇压仇家" + g.kills + "名。",
    ascended ? "渡劫成功,白日飞升。身后只留下一地灵石与满屏弹幕:“前排围观!”"
      : (g.enemies.length ? "仇人录上还有" + g.enemies.length + "个名字没划掉,他们表示节哀,并准备来刨坟。" : "仇人录已清空,不可谓不圆满。"),
    "墓志铭:" + pick(["莫欺少年穷,可惜他没等到三十年河西。", "主角光环终有尽,作者今日要下班。", "他走得很安详,因为系统说“宿主,该重开了”。", "下辈子一定要选个靠谱的天赋。"])
  ];
  return { title: title, cause: cause, ascended: !!ascended, score: score, epitaph: epitaph, realmName: realmName };
}
function endLife(g, cause, ascended) {
  const res = buildResult(g, cause, ascended);
  g.result = res;
  g.phase = "end";
  g.auto = false;
  g.event = null;
  const m = g.meta;
  m.rounds++;
  m.best = Math.max(m.best, res.score);
  m.prevTalents = g.talents.slice();
  m.history.unshift({ name: g.name, identity: IDN_BY_ID[g.identityId].name, realm: res.realmName, score: res.score, title: res.title, ascended: !!ascended });
  if (m.history.length > 10) m.history.length = 10;
  addLog(g, "【陨落】" + cause + "——" + res.title, ascended ? "epic" : "bad");
}
/* 每次行动后调用:同步血量上限,判定死亡,处理复活 */
function settle(g) {
  if (g.phase !== "play") return;
  g.hpMax = hpMaxOf(g);
  if (g.hp > g.hpMax) g.hp = g.hpMax;
  g.stone = Math.max(0, Math.floor(g.stone));
  if (hasT(g, "T_POOR") && g.stone < 10 && chance(0.4)) {
    const v = addStone(g, rint(100, 500) * (g.realm + 1));
    addLog(g, "【穷鬼转世】灵石花光了,你在路边捡到一个神秘小袋子,里面有" + fmt(v) + "灵石!", "rare");
  }
  let cause = g.dying || null;
  const byHp = !cause && g.hp <= 0;
  if (byHp) cause = "气血归零,身死道消";
  if (!cause && g.age >= g.lifeMax) cause = "寿元耗尽,坐化于洞府";
  if (!cause) return;
  g.dying = null;
  if (hasT(g, "T_FATESON") && g.reviveLeft.protag > 0) {
    g.reviveLeft.protag--; trig(g, "T_FATESON");
    const how = pick(["爷爷附体,替你扛下致命一击", "神秘戒指苏醒,一道白光护住心脉", "路边老乞丐竟是大佬,隔空一指把你救了回来"]);
    g.hp = Math.floor(hpMaxOf(g) * 0.6);
    g.lifeMax = Math.max(g.lifeMax, g.age + 20);
    addLog(g, "【天命主角光环】" + cause + "?不可能!" + how + "。(剩余" + g.reviveLeft.protag + "次)", "epic");
    return;
  }
  if (hasT(g, "T_UNLUCKY") && g.reviveLeft.unlucky > 0) {
    g.reviveLeft.unlucky--; trig(g, "T_UNLUCKY");
    g.hp = Math.floor(hpMaxOf(g) * 0.5);
    g.lifeMax = Math.max(g.lifeMax, g.age + 10);
    addLog(g, "【非酋之王】天道看你太惨,补偿了一次重开机会!", "rare");
    return;
  }
  if (byHp && g.shield > 0) {
    g.shield--;
    g.hp = Math.floor(hpMaxOf(g) * 0.3);
    addLog(g, "护身符碎裂,替你挡下了致命一击!", "rare");
    return;
  }
  endLife(g, cause, false);
}

// ============================================================================
//                              主组件 App
// ============================================================================
function App() {
  const [g, setG] = useState(() => loadSave() || freshGame());
  const gRef = useRef(g);
  const actionsRef = useRef({});

  const commit = n => { gRef.current = n; setG(n); };
  /* 任意阶段修改状态(抽卡 / 读档等) */
  const mutate = fn => { const n = cloneG(gRef.current); fn(n); commit(n); };
  /* 修仙阶段的一次行动:深拷贝 -> 修改 -> 结算 -> 提交;有奇遇弹窗时默认禁止其他行动 */
  const act = (fn, opt) => {
    opt = opt || {};
    const cur = gRef.current;
    if (cur.phase !== "play" || (cur.event && !opt.allowEvent)) return;
    const n = cloneG(cur);
    fn(n);
    settle(n);
    commit(n);
  };

  /* ---------- 本地存档 ---------- */
  useEffect(() => {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(g)); } catch (e) {}
  }, [g]);
  const saveNow = () => { try { localStorage.setItem(MANUAL_KEY, JSON.stringify(gRef.current)); return true; } catch (e) { return false; } };
  const loadNow = () => { const s = loadSave(MANUAL_KEY); if (s) { commit(s); return true; } return false; };
  const hasSave = () => { try { return !!localStorage.getItem(MANUAL_KEY); } catch (e) { return false; } };
  /* 轮回重开:保留 meta(轮回次数、上一世天赋、历史) */
  const restart = () => { commit(freshGame(gRef.current.meta)); };
  /* 彻底清档 */
  const hardReset = () => { try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(MANUAL_KEY); } catch (e) {} commit(freshGame()); };

  /* ---------- 开局抽卡 ---------- */
  const refreshPool = () => mutate(n => {
    n.draw.pool = rollPool(n.draw.picks);
    n.draw.refresh++;
  });
  const togglePick = id => mutate(n => {
    const i = n.draw.picks.indexOf(id);
    if (i >= 0) { n.draw.picks.splice(i, 1); if (n.draw.keep === id) n.draw.keep = null; }
    else if (n.draw.picks.length < 3) n.draw.picks.push(id);
  });
  /* 保留上一世的 1 个天赋(占 1 个名额) */
  const toggleKeep = id => mutate(n => {
    if (n.draw.keep === id) {
      n.draw.keep = null;
      n.draw.picks = n.draw.picks.filter(x => x !== id);
      return;
    }
    if (n.draw.keep) n.draw.picks = n.draw.picks.filter(x => x !== n.draw.keep);
    n.draw.pool = n.draw.pool.filter(x => x !== id);
    n.draw.picks = n.draw.picks.filter(x => x !== id);
    if (n.draw.picks.length >= 3) n.draw.picks.pop();
    n.draw.picks.unshift(id);
    n.draw.keep = id;
  });
  const rerollName = () => mutate(n => { n.name = randName(); });
  /* 选满3个 -> 随机分配身份 -> 进入“身份降临”阶段 */
  const confirmDraw = () => mutate(n => {
    if (n.draw.picks.length !== 3) return;
    n.identityId = pick(IDENTITIES).id;
    if (!n.name) n.name = randName();
    n.phase = "intro";
  });
  const rerollIdentity = () => mutate(n => { n.identityId = pick(IDENTITIES).id; });
  const startLife = () => mutate(n => { startWorld(n); });

  /* ---------- 1. 闭关苦修 ---------- */
  const handleCultivate = () => act(g => {
    advance(g, 1);
    if (g.phase !== "play" || g.dying) return;
    let base = Math.max(40, REALMS[g.realm].need * rnd(0.11, 0.2)) * (1 + g.stats.wit / 80);
    if (hasT(g, "T_ALLDAO")) { base *= 3; trig(g, "T_ALLDAO"); }
    const r = Math.random();
    if (r < 0.12 + g.stats.wit / 1000) {
      base *= 3;
      if (chance(0.3)) g.stats.wit += 1;
      const v = gainExp(g, base);
      addLog(g, "【顿悟】你枕着一块石头睡了一觉,梦里大道三千。修为+" + fmt(v) + (chance(0.3) ? ",悟性+1" : "") + "。", "rare");
    } else if (r > 0.92) {
      const d = hurt(g, rnd(0.25, 0.4), true);
      g.exp = Math.max(0, g.exp - Math.floor(REALMS[g.realm].need * 0.08));
      const v = gainExp(g, base * 0.3);
      addLog(g, "【走火入魔】灵气逆行,你喷出一口老血。气血" + (d ? "-" + fmt(d) : "无损(万法不沾)") + ",修为净变化" + fmt(v - REALMS[g.realm].need * 0.08) + "。", "bad");
    } else {
      const v = gainExp(g, base);
      addLog(g, "闭关一年,吐纳天地灵气,修为+" + fmt(v) + "。", "good");
    }
  });

  /* ---------- 2. 外出历练 ---------- */
  const handleExplore = () => act(g => {
    advance(g, 0.5);
    if (g.phase !== "play" || g.dying) return;
    if (g.buff === "must_treasure" && chance(0.5)) {
      const it = pick(["P07", "P11"]); addItem(g, it);
      addLog(g, "【必捡仙器】历练途中你随手捡到「" + ITEM_BY_ID[it].name + "」!", "rare");
    }
    if (chance(0.82)) {
      const pool = EVENTS.filter(e => e.id !== g.lastEvent);
      const ev = wpick(pool, e => 1 + (e.choices.some(c => c.need && hasT(g, c.need)) ? 1.5 : 0));
      g.lastEvent = ev.id;
      g.event = { id: ev.id, step: "choose", npcId: guessNpc(g, ev) };
      addLog(g, "【奇遇】" + ev.title, "rare");
    } else {
      const m = pick(MINOR_EVENTS);
      const s = 1 + g.realm * 2;
      const fx = {};
      if (m.stone) fx.stone = Math.floor(m.stone * s);
          if (m.expF) fx.exp = Math.floor(REALMS[g.realm].need * m.expF);
      if (m.hp) fx.hp = m.hp;
      if (m.charm) fx.charm = m.charm;
      if (m.wit) fx.wit = m.wit;
      if (m.item) fx.item = m.item;
      const gains = applyFx(g, fx);
      addLog(g, m.t + (gains.length ? "(" + gains.join(",") + ")" : ""), m.k);
    }
  });

  /* ---------- 奇遇选项结算(含【大孝子认义父】【沙雕之王】翻转) ---------- */
  const handleEventChoice = idx => act(g => {
    if (!g.event) return;
    const ev = EVENT_BY_ID[g.event.id];
    const c = ev && ev.choices[idx];
    if (!c || (c.need && !hasT(g, c.need))) return;
    const npcId = g.event.npcId;
    let o = pickOutcome(c.outcomes, g);
    if (c.need) trig(g, c.need);
    if (hasT(g, "T_MEME") && chance(0.5)) {
      const pool = o.kind === "bad"
        ? c.outcomes.filter(x => x.kind !== "bad")
        : c.outcomes.filter(x => x.kind === "bad");
      if (pool.length) {
        o = wpick(pool);
        trig(g, "T_MEME");
        addLog(g, "【沙雕之王】天道没看懂你的操作,结果被翻转了一次!", "epic");
      }
    }
    const fx = Object.assign({}, o.fx);
    if (fx.favor > 0 && g.wives.some(w => w.id === npcId) && ntrCheck(g, npcId)) delete fx.favor;
    const ctx = { npcId: npcId, title: ev.title, dieText: "「" + ev.title + "」中身死道消" };
    const npc = NPC_BY_ID[npcId];
    const text = o.text.replace(/\{npc\}/g, npc ? npc.name : "对方");
    const gains = applyFx(g, fx, ctx);
    addLog(g, "【" + ev.title + "】" + text, o.kind);
    if (gains.length) addLog(g, "结果:" + gains.join(","), o.kind === "bad" ? "bad" : "good");
    g.event = null;
  }, { allowEvent: true });

  /* ---------- 3. 冲击境界 / 渡九九天劫 ---------- */
  const handleBreakthrough = () => act(g => {
    const ascend = g.realm >= 16;
    const need = expNeed(g);
    if (g.exp < need) { addLog(g, "修为不足,还差" + fmt(need - g.exp) + "。强行冲关只会炸丹田。", "bad"); return; }
    advance(g, 1);
    if (g.phase !== "play" || g.dying) return;
    const nx = ascend ? 16 : g.realm + 1;
    let rate = REALMS[nx].rate + g.breakBonus + successBonus(g) * 0.5 + g.stats.wit / 1000;
    if (hasT(g, "T_ALLDAO")) { rate += 0.3; trig(g, "T_ALLDAO"); }
    if (hasT(g, "T_CURSE")) { rate -= 0.2; trig(g, "T_CURSE"); }
    rate = clamp(rate, 0.05, 0.99);
    const forced = g.buff === "break100";
    if (forced) rate = 1;
    addLog(g, "你开始冲击「" + REALMS[nx].name + "」,成功率 " + Math.round(rate * 100) + "%。", "info");

    // 雷劫(筑基及以后)
    if (nx >= 9) {
      let frac = ascend ? 0.9 : 0.12 + nx * 0.03;
      if (hasT(g, "T_CURSE")) { frac += 0.15; addLog(g, "【天道弃子】天道嫌你,额外补了一道雷:“废物,你怎么还不死。”", "bad"); }
      if (hasT(g, "T_BLOODCOW")) {
        frac *= 0.2; trig(g, "T_BLOODCOW");
        addLog(g, "【十里坡血牛】你用无底血池硬扛天雷,雷劫被反伤劈得没了脾气。", "rare");
      }
      const d = hurt(g, frac, false);
      addLog(g, d ? "天雷加身,气血-" + fmt(d) + "。" : "天雷劈在身上,毫发无损。", d ? "bad" : "good");
      if (g.hp <= 0 && g.shield <= 0) { g.dying = "渡劫失败,被天雷劈成焦炭"; return; }
    }

    const ok = chance(rate);
    g.breakBonus = 0;
    if (ok) {
      g.exp -= need;
      if (ascend) {
        g.exp = 0;
        endLife(g, "九九天劫尽数扛下,白日飞升", true);
        return;
      }
      realmUp(g);
      if (hasT(g, "T_LONGLIFE")) trig(g, "T_LONGLIFE");
      if (REALMS[g.realm].life >= 200) {
        g.broadcast = { kind: "break", title: "突破·" + REALMS[g.realm].name, lines: [REALMS[g.realm].flavor, "寿元上限 " + fmt(g.lifeMax) + " 年"] };
      }
    } else {
      const lose = Math.floor(need * 0.2);
      g.exp = Math.max(0, g.exp - lose);
      g.stats.luck = Math.max(1, g.stats.luck - 1);
      addLog(g, "突破失败!灵气反噬,修为-" + fmt(lose) + "。你抱着空丹瓶哭了一整晚。", "bad");
    }
  });

  /* ---------- 求偶门槛:道侣直接通过,非道侣好感不足则被拒 ---------- */
  const courtGate = (g, npc, favorNeed, what) => {
    const st = g.npc[npc.id];
    if (!st.alive) { addLog(g, npc.name + "已不在人世。", "bad"); return false; }
    if (st.stolen) { addLog(g, npc.name + "已被别人抢走,你只能对着月亮叹气。", "bad"); return false; }
    if (g.wives.some(w => w.id === npc.id)) return true;
    if (st.favor < favorNeed) { refusal(g, npc, what); return false; }
    if (ntrCheck(g, npc.id)) return false;
    if (!addWife(g, npc.id)) {
      addLog(g, "你的道侣已满" + WIFE_LIMIT + "位," + npc.name + "挑眉:“想娶我?先把家里清理干净。”", "bad");
      return false;
    }
    return true;
  };

  /* ---------- 4. 后宫赠礼(含【舔狗万倍返还】) ---------- */
  const handleGift = (npcId, itemId) => act(g => {
    const npc = NPC_BY_ID[npcId];
    const st = g.npc[npcId];
    if (!npc || !st.alive || st.stolen) { addLog(g, "这位已经不能收礼了。", "bad"); return; }
    let cost, giftName;
    if (itemId) {
      if (!g.bag[itemId]) return;
      cost = Math.max(100, ITEM_BY_ID[itemId].price || 300);
      giftName = ITEM_BY_ID[itemId].name;
      takeItem(g, itemId);
    } else {
      cost = Math.max(100, Math.floor(REALMS[g.realm].need * 0.02));
      if (g.stone < cost) { addLog(g, "灵石不足" + fmt(cost) + ",你连舔狗的资格都没有。", "bad"); return; }
      g.stone -= cost;
      giftName = fmt(cost) + "灵石";
    }
    advance(g, 0.25);
    if (g.phase !== "play" || g.dying) return;
    let d = Math.round(8 + Math.pow(cost, 0.35));
    if (hasT(g, "T_BEAUTY")) { d *= 2; trig(g, "T_BEAUTY"); }
    if (g.buff === "charm_max") d *= 2;
    setFavor(g, npcId, d);
    addLog(g, "你把" + giftName + "送给" + npc.name + ",好感+" + d + "。", "good");

    if (hasT(g, "T_LICKDOG")) {
      trig(g, "T_LICKDOG");
      const mul = Math.floor(Math.exp(rnd(Math.log(100), Math.log(10000))));
      const kind = pick(["stone", "pill", "book"]);
      const lines = [npc.name + "说:“你是个好人。”", "系统:叮——万倍返还触发!×" + mul];
      if (kind === "stone") {
        const v = addStone(g, cost * mul);
        lines.push("海量灵石从天而降:+" + fmt(v));
        if (mul >= 2000) { addItem(g, "P18"); lines.push("还附赠「海量灵石袋」一只"); }
      } else if (kind === "pill") {
        const it = mul >= 3000 ? "P16" : "P04";
        addItem(g, it);
        if (mul >= 6000) addItem(g, "P05");
        lines.push("高阶仙丹入袋:「" + ITEM_BY_ID[it].name + "」" + (mul >= 6000 ? "+「多子多福丸」" : ""));
      } else {
        const it = mul >= 1000 ? "P17" : "P19";
        addItem(g, it);
        lines.push("神级功法落入掌中:「" + ITEM_BY_ID[it].name + "」");
      }
      g.broadcast = { kind: "lickdog", title: "舔狗万倍返还 ×" + mul, lines: lines };
      addLog(g, "【舔狗万倍返还】×" + mul + "!" + lines.slice(2).join(","), "epic");
    }
  });

  /* ---------- 5a. 双修 ---------- */
  const handleDualCultivate = npcId => act(g => {
    const npc = NPC_BY_ID[npcId];
    advance(g, 0.5);
    if (g.phase !== "play" || g.dying) return;
    if (!courtGate(g, npc, 60, "求双修")) return;
    let v = Math.max(REALMS[g.realm].need * 0.3, REALMS[npc.realm].need * 0.05) * rnd(0.8, 1.2);
    v = gainExp(g, v);
    setFavor(g, npcId, 3);
    addLog(g, "你与" + npc.name + "共修大道,水乳交融,修为+" + fmt(v) + "。", "rare");
    if (npcId === "N03" && chance(0.25)) {
      const l = Math.floor(g.exp * 0.05);
      g.exp -= l;
      const d = hurt(g, 0.1, true);
      addLog(g, "圣女又偷偷采了你一口:修为-" + fmt(l) + ",气血-" + fmt(d) + "。她笑:“小弟弟,多谢款待。”", "bad");
    }
  });

  /* ---------- 5b. 孕育子嗣 ---------- */
  const handleHaveBaby = npcId => act(g => {
    const npc = NPC_BY_ID[npcId];
    advance(g, 1);
    if (g.phase !== "play" || g.dying) return;
    if (!courtGate(g, npc, 80, "想要你的孩子")) return;
    const st = g.npc[npcId];
    const forced = g.guaranteeChild;
    if (!forced && g.age - st.lastBaby < 2) {
      addLog(g, npc.name + "刚生完不久,瞪了你一眼:“让我歇两年。”", "bad");
      return;
    }
    const p = 0.35 + st.favor / 300 + g.stats.luck / 500 + (hasT(g, "T_MULTICHILD") ? 0.2 : 0);
    if (forced || chance(clamp(p, 0.1, 0.9))) {
      g.guaranteeChild = false;
      bearChild(g, npcId);
    } else {
      addLog(g, "你与" + npc.name + "努力了一整年,肚子没有动静。她说:“再试试。”", "info");
    }
  });

  /* ---------- 6. 仇人录上门镇压 ---------- */
  const handleRevenge = enemyId => act(g => {
    const e = g.enemies.find(x => x.id === enemyId);
    if (!e) return;
    advance(g, 0.5);
    if (g.phase !== "play" || g.dying) return;
    // 嘴遁
    if (hasT(g, "T_BARDHEART")) {
      const p = clamp(0.3 + g.stats.charm * 0.005, 0.3, 0.85);
      if (chance(p)) {
        trig(g, "T_BARDHEART");
        g.enemies = g.enemies.filter(x => x.id !== e.id);
        g.followers++;
        const v = gainExp(g, Math.floor(e.exp * 0.2));
        addLog(g, "【嘴遁大师】你一句“你听我解释”,「" + e.name + "」热泪盈眶,当场拜你为主。修为+" + fmt(v) + "。", "epic");
        return;
      }
      gainExp(g, Math.max(10, Math.floor(REALMS[g.realm].need * 0.01)));
      addLog(g, "【嘴遁大师】劝降失败,但你的台词也让你有所感悟。", "info");
    }
    if (chance(winRate(g, e))) {
      const loot = addStone(g, Math.floor(e.stone * (hasT(g, "T_ROBBER") ? 3 : 1)));
      const ex = gainExp(g, Math.floor(e.exp * 0.3));
      g.enemies = g.enemies.filter(x => x.id !== e.id);
      g.kills++;
      addLog(g, "你上门镇压「" + e.name + "」,缴获全部身家灵石" + fmt(loot) + ",修为+" + fmt(ex) + "。", "good");
      if (hasT(g, "T_ROBBER")) trig(g, "T_ROBBER");
      if (hasT(g, "T_BLOODCOW")) { trig(g, "T_BLOODCOW"); addLog(g, "【十里坡血牛】对方的刀先崩了,真实反伤触发。", "rare"); }
      if (chance(0.3)) { const it = pick(["P01", "P02", "P13", "P20"]); addItem(g, it); addLog(g, "从对方身上搜出「" + ITEM_BY_ID[it].name + "」。", "good"); }
      if (hasT(g, "T_DEVOUR")) {
        trig(g, "T_DEVOUR");
        const ab = gainExp(g, Math.floor(e.exp * 0.5));
        g.demon++;
        addLog(g, "【吞天魔功】你吞噬了对方50%修为,修为+" + fmt(ab) + ",心魔" + g.demon + "/10。", "epic");
        if (g.demon >= 10 && !g.hunted) { g.hunted = true; addLog(g, "心魔满10,你被当成魔头,全修仙界开始追杀!", "bad"); }
      }
      if (e.female && e.npcId) {
        const npc = NPC_BY_ID[e.npcId];
        if (g.npc[e.npcId].alive && !g.npc[e.npcId].stolen) {
          if (addWife(g, e.npcId)) addLog(g, "你对" + npc.name + "说:“从今天起,你是我的人。”她咬牙切齿地被【收入房中】。", "epic");
          else addLog(g, "你想把" + npc.name + "收入房中,但道侣名额已满,只好先关着。", "info");
        }
      }
    } else {
      if (hasT(g, "T_HARDEMPEROR")) {
        trig(g, "T_HARDEMPEROR");
        const s = addStone(g, Math.floor(e.stone * 0.2));
        addLog(g, "【老阴比】打不过就撤,临走顺走对方灵石" + fmt(s) + "。", "rare");
        return;
      }
      const d = hurt(g, rnd(0.3, 0.6), false, true);
      const lost = Math.floor(g.stone * 0.2);
      g.stone -= lost;
      addLog(g, "你不敌「" + e.name + "」,气血-" + fmt(d) + ",灵石被抢走" + fmt(lost) + "。", "bad");
      if (g.hp <= 0 && g.shield <= 0) g.dying = "被仇家「" + e.name + "」当场斩杀";
    }
  });

  /* ---------- 7. 储物戒用药 / 万宝楼购买 ---------- */
  const handleUseItem = (itemId, opts) => act(g => {
    const it = ITEM_BY_ID[itemId];
    if (!it || !g.bag[itemId]) return;
    takeItem(g, itemId);
    const gains = applyItem(g, it, opts || {});
    addLog(g, "你使用了「" + it.name + "」。" + (gains.length ? gains.join(",") + "。" : ""), "rare");
    if (hasT(g, "T_PILLGOD") && it.type === "丹药") addLog(g, "【丹药当饭吃】药效额外触发一次!", "epic");
  });
  const handleBuyItem = (itemId, qty) => act(g => {
    const it = ITEM_BY_ID[itemId];
    qty = qty || 1;
    if (!it || !it.shop) return;
    const price = Math.floor(it.price * (hasT(g, "T_POOR") ? 1.5 : 1)) * qty;
    if (g.stone < price) { addLog(g, "灵石不足,万宝楼伙计白了你一眼:“没钱别摸。”", "bad"); return; }
    g.stone -= price;
    addItem(g, itemId, qty);
    addLog(g, "你在万宝楼花" + fmt(price) + "灵石买下「" + it.name + "」×" + qty + "。", "good");
  });

  /* ---------- 酒剑仙:喝酒 ---------- */
  const handleDrink = () => act(g => {
    if (!hasT(g, "T_ALCOHOL")) return;
    advance(g, 0.25);
    if (g.phase !== "play" || g.dying) return;
    g.drunk = 4;
    trig(g, "T_ALCOHOL");
    addLog(g, "【酒剑仙】你干了一坛,战力×3,持续数次行动。", "epic");
    if (chance(0.5)) {
      const name = pick(["醉仙楼掌柜", "邻桌大汉", "路过的剑修", "隔壁宗门长老"]);
      addEnemy(g, { name: name, power: clamp(g.realm + rint(0, 2), 0, 16) });
      addLog(g, "醉里挑灯看剑,你骂了「" + name + "」一句,醒来多了一个仇家。", "bad");
    }
  });

  /* ---------- 杂项交互 ---------- */
  const toggleAuto = () => mutate(n => { if (n.phase === "play") n.auto = !n.auto; });
  const closeBroadcast = () => mutate(n => { n.broadcast = null; });

  /* ---------- 自动修仙定时器 ---------- */
  actionsRef.current = { handleCultivate, handleExplore, handleBreakthrough, handleEventChoice, handleUseItem };
  useEffect(() => {
    if (!g.auto || g.phase !== "play") return;
    const timer = setInterval(() => {
      const cur = gRef.current;
      const A = actionsRef.current;
      if (!cur.auto || cur.phase !== "play") return;
      if (cur.broadcast) return;
      if (cur.event) {
        const vis = visibleChoices(EVENT_BY_ID[cur.event.id], cur);
        const talent = vis.filter(v => v.c.need);
        A.handleEventChoice((talent.length ? pick(talent) : pick(vis)).i);
        return;
      }
      if (cur.lifeMax - cur.age < 5 && cur.bag.P04) { A.handleUseItem("P04"); return; }
      if (cur.hp < cur.hpMax * 0.4 && cur.bag.P13) { A.handleUseItem("P13"); return; }
      if (cur.exp >= expNeed(cur) && cur.hp > cur.hpMax * 0.5) { A.handleBreakthrough(); return; }
      if (cur.hp < cur.hpMax * 0.4) { A.handleCultivate(); return; }
      if (chance(0.75)) A.handleCultivate(); else A.handleExplore();
    }, 900);
    return () => clearInterval(timer);
  }, [g.auto, g.phase]);

  /* ---------- 供界面使用的派生数据 ---------- */
  const power = g.phase === "play" || g.phase === "end" ? calcPower(g) : 0;
  const needExp = g.phase === "play" || g.phase === "end" ? expNeed(g) : 0;
  const curEvent = g.event ? EVENT_BY_ID[g.event.id] : null;
  const curIdentity = g.identityId ? IDN_BY_ID[g.identityId] : null;
  const prevTalents = (g.meta && g.meta.prevTalents) || [];

// ====== 第二部分结束，等待输出第三部分 ======
  /* ===== 第三部分:UI 辅助状态(Hook 必须在 return 之前) ===== */
  const [tab, setTab] = useState(0);
  const [shopOpen, setShopOpen] = useState(false);
  const [shopInRing, setShopInRing] = useState(false);
  const [toast, setToast] = useState("");
  const flash = msg => { setToast(msg); setTimeout(() => setToast(""), 2000); };
  const logEnd = useRef(null);
  useEffect(() => { if (logEnd.current) logEnd.current.scrollIntoView({ behavior: "smooth", block: "end" }); }, [g.logs ? g.logs.length : 0]);

  const logClass = l => {
    if (l.k === "bad") return "log-line log-bad";
    if (/诞下|道侣|双修|好感|收入房中|孕|情书|表白/.test(l.t) && l.k !== "bad") return "log-line";
    if (/【(舔狗|十里坡|月抛|多子|天命|签到|大孝子|被拒|老阴比|沙雕|酒剑仙|吞天|天煞|嘴遁|魔心|拷贝)/.test(l.t)) return "log-line log-rare";
    if (l.k === "epic") return "log-line log-epic";
    if (l.k === "rare") return "log-line log-rare";
    if (l.k === "good") return "log-line log-good";
    return "log-line";
  };
  const logStyle = l => (/诞下|道侣|双修|收入房中|孕/.test(l.t) && l.k !== "bad") ? { color: "#ffb3d1", borderLeftColor: "#ff6fa8" } : {};

  const gradeCls = t => t.grade === "彩" ? "grade-rainbow" : t.grade === "金" ? "grade-gold" : t.grade === "紫" ? "grade-purple" : "grade-black";
  const gradeTxt = t => t.grade === "彩" ? "rainbow-text" : t.grade === "金" ? "text-gold-grade" : t.grade === "紫" ? "text-purple-grade" : "text-black-grade";
  const gradeLabel = t => t.grade === "彩" ? "天道级" : t.grade === "金" ? "仙品" : t.grade === "紫" ? "奇葩·邪魔" : "天谴";

  const renderTalent = (t, opts) => {
    opts = opts || {};
    const body = (
      <div className={t.grade === "彩" ? "inner" : "p-3"} style={{ height: "100%" }}>
        <div className="flex justify-between items-center mb-1">
          <span className="tname text-lg">{t.name}</span>
          <span className={"text-xs " + gradeTxt(t)}>{gradeLabel(t)}</span>
        </div>
        <div className="text-xs leading-relaxed" style={{ color: "#cfc8b2" }}>{opts.full === false ? t.desc.slice(0, 60) + "…" : t.desc}</div>
        {opts.extra}
      </div>
    );
    return (
      <div key={t.id} onClick={opts.onClick}
        className={gradeCls(t) + " " + (opts.onClick ? "cursor-pointer " : "") + (opts.selected ? "ring-4 ring-white/80 " : "") + (opts.dim ? "opacity-40 " : "")}
        style={{ transition: "transform .2s" }}>
        {body}
      </div>
    );
  };

  const shopPrice = it => Math.floor(it.price * (hasT(g, "T_POOR") ? 1.5 : 1));
  const renderShop = () => (
    <div className="space-y-2">
      <div className="text-sm" style={{ color: "#f5d87a" }}>💰 持有灵石:{fmt(g.stone || 0)}{hasT(g, "T_POOR") ? "(穷鬼转世:物价×1.5)" : ""}</div>
      {ITEMS.filter(i => i.shop).map(it => (
        <div key={it.id} className="gold-card p-2">
          <div className="flex justify-between items-center">
            <span><b className="tier-legend">{it.name}</b> <span className="tag">{it.tier}</span><span className="tag tag-jade">{it.type}</span></span>
            <button className="btn-gold text-sm" disabled={g.stone < shopPrice(it)} onClick={() => handleBuyItem(it.id, 1)}>{fmt(shopPrice(it))} 灵石</button>
          </div>
          <div className="text-xs mt-1" style={{ color: "#b9b29a" }}>{it.desc}</div>
        </div>
      ))}
    </div>
  );

  const metOf = id => {
    const s = g.npc && g.npc[id];
    return !!s && (s.met || (g.wives || []).some(w => w.id === id) || g.master === id || (g.enemies || []).some(e => e.npcId === id));
  };

  const bagIds = Object.keys(g.bag || {}).filter(k => g.bag[k] > 0);
  const fedPerYear = (g.children || []).filter(c => c.adult).reduce((s, c) => {
    const r = ROOT_BY_ID[c.root];
    const need = REALMS[Math.min(g.realm, 15)].need;
    return s + Math.min(need * 2, need * 0.01 * r.feedMul);
  }, 0);

  return (
    <div className="min-h-screen" style={{ color: "var(--text)" }}>
      {toast && <div style={{ position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)", zIndex: 90, background: "#1c160a", border: "1px solid #d4af37", color: "#f5d87a", padding: "8px 20px", borderRadius: 8 }}>{toast}</div>}

      {/* ============ 全屏播报 ============ */}
      {g.broadcast && (
        <div className="modal-mask" style={{ zIndex: 80, background: "rgba(10,8,0,0.9)" }} onClick={closeBroadcast}>
          <div className="gold-card pop-in p-8 text-center max-w-xl" style={{ boxShadow: "0 0 80px rgba(245,216,122,0.8)" }}>
            <div className="text-4xl gold-title font-bold mb-4">{g.broadcast.title}</div>
            {g.broadcast.lines.map((l, i) => <div key={i} className="text-lg my-1" style={{ color: i === 0 ? "#ffd84d" : "#e8e2cf" }}>{l}</div>)}
            <button className="btn-gold mt-6" onClick={closeBroadcast}>笑纳天道馈赠</button>
          </div>
        </div>
      )}

      {/* ============ 阶段一:轮回殿 ============ */}
      {g.phase === "draw" && (
        <div className="max-w-6xl mx-auto p-4">
          <div className="text-center my-4">
            <div className="text-4xl md:text-5xl font-bold gold-title">诸天轮回 · 脑洞修仙模拟器</div>
            <div className="mt-2" style={{ color: "#9fb7ac" }}>轮回殿 · 十连抽天赋(第 {g.meta.rounds + 1} 世)</div>
          </div>
          <div className="gold-card p-4 mb-4 flex flex-wrap items-center gap-3 justify-between">
            <div>
              已选 <b className="text-gold-grade">{g.draw.picks.length}/3</b>
              <span className="ml-3 text-sm" style={{ color: "#9fb7ac" }}>逆天改命已用 {g.draw.refresh} 次(无限次)</span>
              <span className="ml-3 text-sm" style={{ color: "#9fb7ac" }}>历史最高分:{g.meta.best}</span>
            </div>
            <div className="flex gap-2 flex-wrap">
              <button className="btn-jade" onClick={refreshPool}>🔄 逆天改命(重抽)</button>
              <button className="btn-gold" disabled={g.draw.picks.length !== 3} onClick={confirmDraw}>⚡ 开启仙途(需选满3个)</button>
              {hasSave() && <button className="btn-gold" onClick={() => flash(loadNow() ? "已读取手动存档" : "还没有手动存档,请先点保存")}>📜 读档</button>}
            </div>
          </div>

          {prevTalents.length > 0 && (
            <div className="jade-card p-4 mb-4">
              <div className="mb-2" style={{ color: "#b8f0dc" }}>🌀 继承上一世天赋(只可保留 1 个,占用 1 个名额):</div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                {prevTalents.map(id => renderTalent(T_BY_ID[id], { onClick: () => toggleKeep(id), selected: g.draw.keep === id, extra: <div className="mt-1 text-xs text-gold-grade">{g.draw.keep === id ? "✔ 已继承" : "点击继承"}</div> }))}
              </div>
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {g.draw.pool.map(id => {
              const t = T_BY_ID[id];
              const sel = g.draw.picks.indexOf(id) >= 0;
              return renderTalent(t, { onClick: () => togglePick(id), selected: sel, dim: !sel && g.draw.picks.length >= 3, extra: <div className="mt-2 text-xs" style={{ color: "#f5d87a" }}>{sel ? "✔ 已选择(再点取消)" : "点击选择"}</div> });
            })}
          </div>
          {g.draw.picks.length > 0 && (
            <div className="gold-card p-3 mt-4">
              <div className="text-sm mb-1" style={{ color: "#f5d87a" }}>当前选择:</div>
              {g.draw.picks.map(id => <span key={id} className={"tag " + (T_BY_ID[id].grade === "黑" ? "tag-red" : T_BY_ID[id].grade === "紫" ? "tag-purple" : "")}>{T_BY_ID[id].name}</span>)}
            </div>
          )}
          {g.meta.history.length > 0 && (
            <div className="gold-card p-3 mt-4">
              <div className="mb-1 gold-title">往世轮回录</div>
              {g.meta.history.map((h, i) => (
                <div key={i} className="text-sm" style={{ color: "#cfc8b2" }}>
                  {h.ascended ? "🌟" : "💀"} {h.name}({h.identity})· {h.realm} · {h.score}分 · {h.title}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* ============ 阶段二:身份降临 ============ */}
      {g.phase === "intro" && curIdentity && (
        <div className="max-w-3xl mx-auto p-4 pt-10">
          <div className="gold-card p-6 pop-in">
            <div className="text-center">
              <div className="text-6xl float-glow">{curIdentity.icon}</div>
              <div className="text-3xl font-bold gold-title mt-2">{curIdentity.name}</div>
              <div className="text-sm mt-1" style={{ color: "#9fb7ac" }}>{curIdentity.tip}</div>
            </div>
            <hr className="divider-gold" />
            <p className="leading-loose" style={{ color: "#e8e2cf" }}>{curIdentity.intro}</p>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-4 text-sm">
              <div className="jade-card p-2 text-center">寿元 {curIdentity.life} 年</div>
              <div className="jade-card p-2 text-center">灵石 {curIdentity.stone}</div>
              <div className="jade-card p-2 text-center">体魄 {curIdentity.stats.body} 悟性 {curIdentity.stats.wit}</div>
              <div className="jade-card p-2 text-center">气运 {curIdentity.stats.luck} 魅力 {curIdentity.stats.charm}</div>
            </div>
            <div className="mt-3 text-sm" style={{ color: "#b9b29a" }}>
              初始羁绊:{curIdentity.bound.type === "none" ? "无" : (curIdentity.bound.type === "spouse" ? "道侣 " : curIdentity.bound.type === "enemy" ? "仇人 " : "师缘 ") + NPC_BY_ID[curIdentity.bound.npc].name + "(" + NPC_BY_ID[curIdentity.bound.npc].title + ")"}
            </div>
            <div className="mt-4 flex items-center gap-2 flex-wrap">
              <span>道号:</span>
              <input value={g.name} onChange={e => { const v = e.target.value.slice(0, 8); mutate(n => { n.name = v; }); }}

          </div>

            <div className="flex items-center gap-4 flex-wrap">

              <span className="tag">修仙纪年:{Math.floor(g.age)} 岁</span>
              <span className="tag tag-jade">第 {g.meta.rounds + (g.phase === "play" ? 1 : 0)} 世</span>

            <div className="flex gap-2 flex-wrap">
              <button className={g.auto ? "btn-blood" : "btn-jade"} onClick={toggleAuto}>{g.auto ? "⏸ 停止自动修仙" : "▶ 自动修仙"}</button>
              <button className="btn-gold" onClick={() => setShopOpen(true)}>🏮 万宝坊市</button>
              <button className="btn-gold" onClick={() => { saveNow(); }}>💾 保存</button>
              <button className="btn-gold" onClick={() => flash(loadNow() ? "已读取手动存档" : "还没有手动存档,请先点保存")}>📜 读档</button>
              <button className="btn-blood" onClick={() => { if (confirm("确定彻底重置存档?轮回记录也会清空!")) hardReset(); }}>🗑 重置</button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">

            {/* ---- 左栏:人物 ---- */}

                <div className="flex items-center gap-3">
                  <div className="text-5xl float-glow">{curIdentity ? curIdentity.icon : "🧘"}</div>
                  <div>
                    <div className="text-xl font-bold gold-title">{g.name}</div>
                    <div className="text-xs" style={{ color: "#9fb7ac" }}>{curIdentity ? curIdentity.name : ""}</div>
                    <div className="mt-1"><span className="tag">{REALMS[g.realm].name}</span></div>
                  </div>
                </div>
                <hr className="divider-gold" />
                <div className="text-xs flex justify-between"><span>骨龄 {Math.floor(g.age)}</span><span>寿元 {fmt(g.lifeMax)}</span></div>
                <div className="bar-wrap"><div className="bar-life" style={{ width: clamp(g.age / g.lifeMax * 100, 0, 100) + "%" }} /></div>
                <div className="text-xs flex justify-between mt-2"><span>修为 {fmt(g.exp)}</span><span>{g.realm >= 16 ? "飞升所需 " : "突破所需 "}{fmt(needExp)}</span></div>
                <div className="bar-wrap"><div className="bar-exp" style={{ width: clamp(g.exp / needExp * 100, 0, 100) + "%" }} /></div>
                <div className="text-xs flex justify-between mt-2"><span>气血 {fmt(g.hp)}</span><span>上限 {fmt(g.hpMax)}</span></div>
                <div className="bar-wrap"><div className="bar-hp" style={{ width: clamp(g.hp / g.hpMax * 100, 0, 100) + "%" }} /></div>
                <div className="grid grid-cols-2 gap-2 mt-3 text-sm">
                  <div className="jade-card p-2">⚔ 战力 <b className="text-gold-grade">{fmt(power)}</b></div>
                  <div className="jade-card p-2">💎 灵石 <b className="text-gold-grade">{fmt(g.stone)}</b></div>
                  <div className="jade-card p-2">💪 体魄 {g.stats.body}</div>
                  <div className="jade-card p-2">🧠 悟性 {g.stats.wit}</div>
                  <div className="jade-card p-2">🍀 气运 {g.stats.luck}</div>
                  <div className="jade-card p-2">🌸 魅力 {g.stats.charm}</div>
                </div>
                <div className="text-xs mt-2" style={{ color: "#9fb7ac" }}>
                  🛡 护身符 {g.shield} · 击杀 {g.kills} · 心魔 {g.demon}/10 {g.hunted ? "· 被通缉" : ""}
                </div>
              </div>

              <div className="space-y-3">
                <div className="gold-title text-lg">携带天赋</div>
                {g.talents.map(id => {
                  const t = T_BY_ID[id];
                  const st = g.tstat[id] || 0;
                  let more = null;
                  if (id === "T_MULTICHILD") more = <div className="text-xs text-gold-grade">子嗣 {g.children.length} 人 · 年反哺约 {fmt(fedPerYear)} · 累计 {fmt(g.feedTotal)}</div>;
                  if (id === "T_MOONGOD") more = <div className="text-xs text-gold-grade">当前外挂:{g.buff ? MOON_BUFFS[g.buff].name : "无"}</div>;
                  if (id === "T_BLOODCOW") more = <div className="text-xs text-gold-grade">累计加成气血 {fmt(g.hpBonus)}</div>;
                  if (id === "T_REJECT") more = <div className="text-xs text-gold-grade">被拒暴涨 {g.rejectCount}/10 次</div>;
                  if (id === "T_FATHER") more = <div className="text-xs text-gold-grade">在世义父 {g.fathers.length} 位</div>;
                  if (id === "T_HAREM") more = <div className="text-xs text-gold-grade">道侣 {g.wives.length} 人 · 战力+{g.wives.length * 8}%</div>;
                  if (id === "T_FATESON") more = <div className="text-xs text-gold-grade">剩余复活 {g.reviveLeft.protag} 次</div>;
                  if (id === "T_DEVOUR") more = <div className="text-xs text-gold-grade">心魔 {g.demon}/10</div>;
                  return renderTalent(t, { full: false, extra: <div className="mt-2 text-xs" style={{ color: "#f5d87a" }}>累计触发:<b>{st}</b> 次{more}</div> });

            </div>

            {/* ---- 中栏:日志 + 奇遇 + 控制台 ---- */}

                  <div key={i} className={logClass(l)} style={logStyle(l)}>
                    <span className="text-xs mr-2" style={{ color: "#7d7660" }}>[{l.y}岁]</span>{l.t}
                  </div>
                ))}
                <div ref={logEnd} />
              </div>

              {curEvent && g.phase === "play" && (
                <div className="gold-card p-4 pop-in" style={{ borderColor: "#f5d87a", boxShadow: "0 0 30px rgba(245,216,122,0.35)" }}>

                  <div className="space-y-2">
                    {visibleChoices(curEvent, g).map(v => (
                      <button key={v.i} onClick={() => handleEventChoice(v.i)}
                        className={(v.c.need ? "btn-jade" : "btn-gold") + " w-full text-left"} style={v.c.need ? { borderColor: "#a855f7", color: "#e2c4ff" } : {}}>
                        <span className={"tag " + (v.c.risk === "高" ? "tag-red" : v.c.risk === "天机" ? "tag-purple" : v.c.risk === "中" ? "" : "tag-jade")}>风险:{v.c.risk}</span>

                      </button>
                    ))}
                  </div>
                </div>

                    advance(n, 0.5);

                    const un = NPCS.filter(x => !metOf(x.id) && n.npc[x.id].alive && !n.npc[x.id].stolen);
                    if (!un.length) { addLog(n, "天下仙子你已尽数结识,再逛就要被当成登徒子了。", "info"); return; }
                    const x = pick(un);
                    n.npc[x.id].met = true;
                    const d = Math.round(x.beauty / 10 + n.stats.charm / 8);
                    setFavor(n, x.id, d);
                    addLog(n, "你在" + pick(["春风楼", "洛水河畔", "万宝楼", "雪峰脚下", "宗门后山"]) + "结识了「" + x.name + "」(" + x.title + "),好感+" + d + "。", "rare");
                  })}>🌸 寻访仙子</button>
                  <button className="btn-purple btn-gold" style={{ borderColor: "#a855f7", color: "#e2c4ff" }} disabled={!!g.event || g.phase !== "play"} onClick={() => {
                    if (hasT(g, "T_ALCOHOL")) { handleDrink(); return; }
                    act(n => {
                      advance(n, 0.25);
                      if (n.phase !== "play" || n.dying) return;
                      const id = pick(n.talents);
                      const t = T_BY_ID[id];
                      trig(n, id);
                      if (id === "T_MOONGOD") { rollMoon(n); return; }
                      const v = gainExp(n, Math.max(50, REALMS[n.realm].need * 0.03));
                      addLog(n, "你对着天空大喊:“" + t.name + "!”天道沉默了三秒,修为+" + fmt(v) + "。围观群众:“这人是不是有病?”", t.grade === "黑" ? "bad" : "epic");
                    });
                  }}>✨ 发动天赋整活</button>
                  <button className={"btn-gold " + (g.exp >= needExp ? "grade-gold" : "")} disabled={!!g.event || g.phase !== "play"} onClick={handleBreakthrough}>
                    ⚡ {g.realm >= 16 ? "渡劫飞升" : "冲击境界"}
                  </button>
                </div>
                <div className="text-xs mt-2" style={{ color: "#7d7660" }}>
                  {g.exp >= needExp ? "修为已满,可以冲关了!" : "闭关苦修一年,历练半年。奇遇出现时需先做出抉择。"}
                  {hasT(g, "T_ALCOHOL") ? " 「发动天赋整活」会让酒剑仙开喝。" : ""}
                </div>
              </div>
            </div>

            {/* ---- 右栏:4 Tab ---- */}
            <div className="lg:col-span-3">
              <div className="gold-card p-2">
                <div className="grid grid-cols-4 gap-1 mb-2">
                  {["🌸后宫", "👶子嗣", "⚔️仇人", "🎒背包"].map((t, i) => (
                    <button key={i} onClick={() => setTab(i)} className={tab === i ? "btn-gold" : "btn-jade"} style={{ padding: "6px 2px", fontSize: 13 }}>{t}</button>
                  ))}
                </div>
                <div style={{ maxHeight: "78vh", overflowY: "auto" }} className="pr-1">

                  {tab === 0 && (
                    <div className="space-y-2">
                      <div className="text-xs" style={{ color: "#9fb7ac" }}>道侣 {g.wives.length}{hasT(g, "T_HAREM") ? "" : "/" + WIFE_LIMIT}。赠礼花费约 {fmt(Math.max(100, Math.floor(REALMS[g.realm].need * 0.02)))} 灵石;双修需好感≥60,孕育需好感≥80(道侣免门槛)。</div>
                      {NPCS.filter(n => metOf(n.id)).length === 0 && <div className="text-sm" style={{ color: "#7d7660" }}>尚未结识任何仙子,点「🌸寻访仙子」。</div>}
                      {NPCS.filter(n => metOf(n.id)).map(n => {
                        const s = g.npc[n.id];
                        const isWife = g.wives.some(w => w.id === n.id);
                        const dead = !s.alive, stolen = s.stolen;
                        return (
                          <div key={n.id} className="jade-card p-2" style={{ opacity: dead || stolen ? 0.5 : 1 }}>
                            <div className="flex justify-between">
                              <b className="text-gold-grade">{n.name}</b>
                              <span className="text-xs">{isWife ? "💍道侣" : dead ? "已故" : stolen ? "被抢走" : n.kind}</span>
                            </div>
                            <div className="text-xs" style={{ color: "#9fb7ac" }}>{n.title} · {REALMS[n.realm].name} · 颜值 {n.beauty}</div>
                            <div>{n.traits.map(t => <span key={t} className="tag tag-jade">{t}</span>)}</div>
                            <div className="text-xs flex justify-between"><span>好感</span><span>{s.favor}</span></div>
                            <div className="bar-wrap"><div style={{ height: "100%", width: clamp((s.favor + 100) / 2, 0, 100) + "%", background: s.favor < 0 ? "linear-gradient(90deg,#4a1a1a,#c33)" : "linear-gradient(90deg,#a03060,#ff8ec0)", transition: "width .4s" }} /></div>
                            <div className="text-xs mt-1" style={{ color: "#b9b29a" }}>{n.desc.slice(0, 54)}…</div>
                            {!dead && !stolen && (
                              <div className="flex gap-1 mt-2 flex-wrap">
                                <button className="btn-gold text-xs" style={{ padding: "4px 8px" }} disabled={!!g.event || g.phase !== "play"} onClick={() => handleGift(n.id)}>🎁赠礼</button>
                                <button className="btn-jade text-xs" style={{ padding: "4px 8px" }} disabled={!!g.event || g.phase !== "play"} onClick={() => handleDualCultivate(n.id)}>💞双修</button>
                                <button className="btn-gold text-xs" style={{ padding: "4px 8px", borderColor: "#ff6fa8", color: "#ffb3d1" }} disabled={!!g.event || g.phase !== "play"} onClick={() => handleHaveBaby(n.id)}>👶孕育</button>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {tab === 1 && (
                    <div className="space-y-2">
                      <div className="jade-card p-2 text-sm">
                        子嗣总数 <b className="text-gold-grade">{g.children.length}</b> · 成年 {g.children.filter(c => c.adult).length} ·
                        年反哺约 <b className="text-gold-grade">{fmt(fedPerYear)}</b> · 累计反哺 {fmt(g.feedTotal)}

                      {g.children.length === 0 && <div className="text-sm" style={{ color: "#7d7660" }}>膝下无子。道侣足够好感后,可点「👶孕育」。</div>}
                      {g.children.map(c => {
                        const r = ROOT_BY_ID[c.root];
                        const need = REALMS[Math.min(g.realm, 15)].need;
                        const feed = c.adult ? Math.min(need * 2, need * 0.01 * r.feedMul) : 0;
                        return (
                          <div key={c.id} className="gold-card p-2">
                            <div className="flex justify-between"><b>{c.name}({c.sex})</b><span className="text-xs">{c.age} 岁{c.adult ? " · 成年" : ""}</span></div>
                            <div className="text-xs" style={{ color: "#9fb7ac" }}>母亲:{c.motherName}</div>
                            <div><span className={"tag " + r.color}>{r.name}</span><span className="tag">反哺×{r.feedMul}</span></div>
                            <div className="text-xs">{c.adult ? "每年反哺修为 " + fmt(feed) : "尚未成年(16岁起反哺)"}</div>
                            <div className="text-xs" style={{ color: "#b9b29a" }}>{r.desc.slice(0, 40)}…</div>
                          </div>
                        );
                      })}
                    </div>

                  {tab === 2 && (
                    <div className="space-y-2">
                      <div className="text-xs" style={{ color: "#9fb7ac" }}>义父暴毙、被抢、结怨都会进这里。女性仇敌战败可收入房中。</div>
                      {g.enemies.length === 0 && <div className="text-sm" style={{ color: "#7d7660" }}>仇人录空空如也,善哉善哉。</div>}
                      {g.enemies.map(e => {
                        const wr = Math.round(winRate(g, e) * 100);
                        return (
                          <div key={e.id} className="gold-card p-2" style={{ borderColor: "#b33" }}>
                            <div className="flex justify-between"><b style={{ color: "#ffb4b4" }}>{e.name}</b><span className="tag tag-red">{REALMS[e.power].name}</span></div>
                            <div className="text-xs" style={{ color: "#9fb7ac" }}>{e.npcId ? NPC_BY_ID[e.npcId].title : "江湖人士"} · 结仇原因:{e.npcId ? "旧怨纠葛" : "因果缠身"}</div>
                            <div className="text-xs">战力约 {fmt(enemyPower(e))} · 身家 {fmt(e.stone)} 灵石 · 预估胜率 {wr}%{e.female ? " · 可收入房中" : ""}</div>
                            <button className="btn-blood mt-1 text-sm" style={{ padding: "4px 10px" }} disabled={!!g.event || g.phase !== "play"} onClick={() => handleRevenge(e.id)}>🗡️上门镇压</button>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {tab === 3 && (
                    <div className="space-y-2">
                      <div className="grid grid-cols-2 gap-1">
                        <button className={!shopInRing ? "btn-gold" : "btn-jade"} onClick={() => setShopInRing(false)}>储物戒</button>
                        <button className={shopInRing ? "btn-gold" : "btn-jade"} onClick={() => setShopInRing(true)}>万宝楼坊市</button>

                        <div className="space-y-2">
                          {bagIds.length === 0 && <div className="text-sm" style={{ color: "#7d7660" }}>储物戒里只有灰尘。</div>}
                          {bagIds.map(id => {
                            const it = ITEM_BY_ID[id];
                            return (
                              <div key={id} className="jade-card p-2">
                                <div className="flex justify-between items-center">
                                  <span><b className="tier-legend">{it.name}</b> ×{g.bag[id]} <span className="tag">{it.tier}</span></span>
                                  <button className="btn-gold text-sm" style={{ padding: "3px 10px" }} disabled={!!g.event || g.phase !== "play"} onClick={() => handleUseItem(id)}>{it.type === "丹药" || it.type === "灵茶" ? "服用" : "使用"}</button>
                                </div>
                                <div className="text-xs mt-1" style={{ color: "#b9b29a" }}>{it.desc}</div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ============ 万宝坊市弹窗 ============ */}
      {shopOpen && (g.phase === "play" || g.phase === "end") && (
        <div className="modal-mask" onClick={() => setShopOpen(false)}>
          <div className="gold-card p-4 pop-in" style={{ maxWidth: 640, width: "100%", maxHeight: "86vh", overflowY: "auto" }} onClick={e => e.stopPropagation()}>

            </div>
            {renderShop()}
          </div>
        </div>

            <div className="text-center">
              <div className="text-4xl">{g.result.ascended ? "🌟" : "🪦"}</div>
              <div className="text-2xl font-bold gold-title">本世轮回结算碑文</div>
              <div className={"text-xl mt-1 " + (g.result.ascended ? "rainbow-text" : "text-gold-grade")}>谥号:{g.result.title}</div>
            </div>
            <hr className="divider-gold" />
            <div className="grid grid-cols-2 gap-2 text-sm">
              <div className="jade-card p-2">存活年数:<b>{Math.floor(g.age)}</b> 岁</div>
              <div className="jade-card p-2">巅峰境界:<b>{g.result.realmName}</b></div>
              <div className="jade-card p-2">道侣:<b>{g.wives.length}</b> 人</div>
              <div className="jade-card p-2">子嗣:<b>{g.children.length}</b> 人</div>
              <div className="jade-card p-2">镇压仇家:<b>{g.kills}</b></div>
              <div className="jade-card p-2">轮回评分:<b className="text-gold-grade">{g.result.score}</b></div>
            </div>
            <div className="mt-3 p-3 rounded" style={{ background: "#0b0d12", border: "1px solid #7a6420" }}>
              {g.result.epitaph.map((l, i) => <div key={i} className="my-1 leading-relaxed" style={{ color: i === 0 ? "#f5d87a" : "#d8d1ba" }}>{l}</div>)}
            </div>
            <div className="mt-3 text-sm" style={{ color: "#9fb7ac" }}>
              本世天赋:{g.talents.map(id => <span key={id} className="tag">{T_BY_ID[id].name}</span>)}
            </div>
            <div className="flex gap-3 justify-center mt-5 flex-wrap">
              <button className="btn-gold" onClick={restart}>🌀 保留1个天赋开启下一世</button>

            </div>
            <div className="text-xs text-center mt-2" style={{ color: "#7d7660" }}>下一世的轮回殿里,可在“继承上一世天赋”区挑 1 个带走。</div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
